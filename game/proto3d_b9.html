<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bảo Khựa · Proto 3D B9 – 1 ngón Archero</title>
<style>
html,body{margin:0;height:100%;background:#0a1628;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#fps{position:absolute;top:10px;left:10px;background:rgba(22,23,27,.72);border:2px solid #FFD91F;border-radius:12px;padding:7px 11px;font:800 12px/1.25 ui-monospace,monospace;color:#FFD91F;box-shadow:3px 3px 0 #16171B}
#fpsDbg{display:none;position:absolute;top:8px;left:8px;z-index:6;pointer-events:none;max-width:min(200px,48vw);background:rgba(22,23,27,.88);border:2px solid #FFD91F;border-radius:10px;padding:6px 8px;font:700 11px/1.35 ui-monospace,monospace;color:#FFD91F;box-shadow:2px 2px 0 #16171B;white-space:pre}
body.fpsdbg #fpsDbg{display:block}
body.fpsdbg #fps{display:none!important}
#qual{pointer-events:auto;position:absolute;top:10px;right:10px;z-index:7;border:2px solid #16171B;background:#FFD91F;color:#16171B;font-weight:800;font-size:12px;border-radius:999px;padding:10px 14px;min-height:44px;min-width:44px;box-shadow:2px 2px 0 #16171B}
body.fpsdbg #qual{top:10px;right:10px}
#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;opacity:.55;text-align:center;width:90%;pointer-events:none;z-index:4}
/* LOW badge never overlaps HSK hint — badge top-right, hint bottom */
#hpHud{pointer-events:none;position:absolute;left:10px;right:90px;top:56px}
body.fpsdbg #hpHud{top:100px!important}
#hpHud .lab{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:2px}
#hpHud .bar{height:10px;background:#133;border:2px solid #16171B;border-radius:8px;overflow:hidden;box-shadow:2px 2px 0 #16171B}
#hpHud .bar i{display:block;height:100%;width:100%}
#bossBar{background:linear-gradient(90deg,#ff6b5a,#ff3b2f)}
#heroBar{background:linear-gradient(90deg,#5dffb0,#1ec8ff)}
#manaRow{margin-top:6px}
#manaBarWrap{height:8px;background:#1a2744;border:2px solid #16171B;border-radius:8px;overflow:hidden;box-shadow:2px 2px 0 #16171B}
#manaBar{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4da3ff,#7c5cff);transition:width .2s}
#comboLab{margin-top:4px;font-size:13px;font-weight:900;color:#FFD91F;min-height:16px;text-shadow:2px 2px 0 #16171B}
#tuViPop{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;z-index:12;font-weight:900;font-size:28px;color:#FFD91F;text-shadow:3px 3px 0 #16171B,0 0 18px #ff9f1a;transition:opacity .25s,transform .35s}
#tuViPop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* Floating joystick (spawn at touch) */
#stickBase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);display:none;pointer-events:none;z-index:8;margin:-60px 0 0 -60px}
#stickKnob{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#FFD91F;border:2px solid #16171B;left:60px;top:60px;box-shadow:0 3px 0 #16171B}
/* Right thumb: Chiêu 80px + ULT ≥64 */
#combatPad{pointer-events:none;position:absolute;right:12px;bottom:18px;width:120px;height:200px;z-index:9}
#combatPad button{pointer-events:auto;position:absolute;border:3px solid #16171B;border-radius:50%;color:#fff;font-weight:800;box-shadow:3px 3px 0 #16171B;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;padding:0;-webkit-tap-highlight-color:transparent}
#skillBtn{width:80px;height:80px;right:8px;bottom:8px;background:linear-gradient(180deg,#5cc8ff,#1E90C6);font-size:13px}
#ultBtn{width:64px;height:64px;right:20px;bottom:100px;background:linear-gradient(180deg,#FFE56B,#FF9F1A);color:#16171B;font-size:12px}
#combatPad button .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%), transparent 0);pointer-events:none}
#combatPad button.disabled{filter:grayscale(.4) brightness(.75)}
#combatPad button .lbl{position:relative;z-index:1;pointer-events:none}
#talkBtn{pointer-events:auto;position:absolute;right:12px;bottom:178px;z-index:9;min-width:64px;min-height:48px;border-radius:14px;border:3px solid #16171B;background:#FFD91F;color:#16171B;font-weight:800;font-size:13px;box-shadow:3px 3px 0 #16171B;padding:6px 10px;line-height:1.15}
/* Question bottom 1/3 */
#qPanel{pointer-events:none;position:absolute;left:50%;bottom:2%;top:auto;transform:translateX(-50%) translateY(12px);width:min(420px,94vw);max-height:32vh;overflow:auto;background:rgba(22,23,27,.94);border:2px solid #FFD91F;border-radius:16px;padding:10px 12px;visibility:hidden;opacity:0;z-index:20;box-shadow:4px 4px 0 #16171B;transition:opacity .25s,transform .3s}
#qPanel.show{visibility:visible;opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#qPanel.hide-out{opacity:0;pointer-events:none}
#qPanel .badge{display:inline-block;font-size:10px;font-weight:800;background:#FFD91F;color:#16171B;border-radius:999px;padding:3px 8px;margin-bottom:4px;border:2px solid #16171B}
#qPanel .zh{font-size:26px;font-weight:800;letter-spacing:.04em}
#qPanel .py{color:#ffe9a8;font-style:italic;font-size:14px;margin-top:2px}
#qPanel .hint{font-size:12px;opacity:.8;margin-top:4px}
#qOpts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#qOpts button{min-height:48px;border-radius:12px;border:2px solid #16171B;background:#fff;color:#16171B;font-weight:700;font-size:14px;box-shadow:2px 2px 0 #16171B;pointer-events:auto}
#qReveal{display:none;margin-top:6px;padding:6px;border-radius:10px;background:rgba(255,217,31,.15);font-size:12px}
#qReveal.on{display:block}
#flashFx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:18;transition:opacity .08s}
#pauseVeil{position:absolute;inset:0;background:rgba(6,12,24,.25);opacity:0;pointer-events:none;z-index:15;transition:opacity .25s}
#pauseVeil.on{opacity:1}
#ultBanner{position:absolute;left:50%;top:16%;transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;z-index:19;font-weight:900;font-size:26px;color:#FFD91F;text-shadow:3px 3px 0 #16171B;transition:opacity .25s,transform .35s}
#ultBanner.on{opacity:1;transform:translateX(-50%) scale(1)}
#dmgLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:11}
.dmg-float{position:absolute;font-weight:900;font-size:22px;text-shadow:2px 2px 0 #16171B;animation:dmgUp 900ms ease-out forwards;pointer-events:none}
.dmg-float.big{font-size:42px;color:#FFE56B}
@keyframes dmgUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
#err{position:absolute;left:12px;right:12px;bottom:90px;background:#5a1020;padding:10px;border-radius:10px;display:none;font-size:13px;z-index:30}
/* Hand 'kéo để chạy' 3s */
#handTut{position:absolute;left:28%;bottom:22%;width:72px;height:72px;z-index:10;pointer-events:none;opacity:0;transition:opacity .3s}
#handTut.on{opacity:1}
#handTut .palm{width:48px;height:56px;border-radius:40% 40% 45% 45%;background:rgba(255,255,255,.92);border:3px solid #16171B;box-shadow:3px 3px 0 #16171B;position:relative;animation:handDrag 1.1s ease-in-out infinite}
#handTut .palm::after{content:attr(data-hint);position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:11px;font-weight:800;color:#FFD91F;text-shadow:2px 2px 0 #16171B;white-space:nowrap}
@keyframes handDrag{0%{transform:translate(0,0)}50%{transform:translate(36px,-28px)}100%{transform:translate(0,0)}}
#loadBanner{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#1E90C6 0%,#2AB8B0 40%,#0E6A78 100%);pointer-events:none}
#loadBanner.hide{opacity:0!important;pointer-events:none!important;display:none!important}
#loadTitle{margin:0;font-size:26px;font-weight:900;color:#16171B;text-shadow:3px 3px 0 #FFD91F}
#loadSub{margin:8px 0 14px;font-size:13px;font-weight:700;color:#16171B;opacity:.85}
.load-bar{width:min(220px,70vw);height:12px;border:3px solid #16171B;border-radius:999px;background:rgba(255,255,255,.4);overflow:hidden;box-shadow:3px 3px 0 #16171B}
.load-bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#FFD91F,#ff9f43)}
body.rec #fps,body.rec #qual,body.rec #hint,body.rec #handTut{display:none!important}
body:not(.ready) #fps,body:not(.ready) #qual,body:not(.ready) #hpHud,body:not(.ready) #combatPad,body:not(.ready) #talkBtn,body:not(.ready) #hint{visibility:hidden}
</style>
<!-- B9: 1-finger Archero controls + 10s script · KHÔNG deploy. -->
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="fps">FPS --</div>
  <div id="fpsDbg" aria-live="polite"></div>
  <button type="button" id="qual" title="Chất lượng">MID</button>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="hpHud">
    <div class="lab"><span id="bossLab">👹 Địch</span><span id="bossHpTxt">180/180</span></div>
    <div class="bar"><i id="bossHpBar" style="display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b5a,#ff3b2f)"></i></div>
    <div class="lab" style="margin-top:6px"><span id="heroLab">🥷 Kiếm Khách</span><span id="heroHpTxt">100/100</span></div>
    <div class="bar"><i id="heroHpBar" style="display:block;height:100%;width:100%;background:linear-gradient(90deg,#5dffb0,#1ec8ff)"></i></div>
    <div id="manaRow">
      <div class="lab"><span>💙 Nội năng</span><span id="manaTxt">100/100</span></div>
      <div id="manaBarWrap"><i id="manaBar"></i></div>
    </div>
    <div id="comboLab"></div>
  </div>
  <div id="combatPad">
    <button type="button" id="ultBtn" title="Ultimate"><span class="cd" id="ultCd"></span><span class="lbl">ULT<br>绝</span></button>
    <button type="button" id="skillBtn" title="Chiêu"><span class="cd" id="sk1Cd"></span><span class="lbl">Chiêu<br>气</span></button>
  </div>
  <button type="button" id="talkBtn">答题<br><span style="font-size:10px;font-weight:700">Trả lời</span></button>
  <div id="handTut" aria-hidden="true"><div class="palm"></div></div>
  <div id="tuViPop">Tu vi +1</div>
  <div id="flashFx"></div>
  <div id="pauseVeil"></div>
  <div id="ultBanner">绝技 · ULTIMATE</div>
  <div id="dmgLayer"></div>
  <div id="loadBanner" aria-live="polite">
    <h1 id="loadTitle">Hạ Long Ngữ Tiên</h1>
    <p id="loadSub">Vịnh học tiếng · 1 ngón</p>
    <div class="load-bar"><i id="loadBar"></i></div>
  </div>
  <div id="qPanel">
    <div class="badge" id="qBadge">答题</div>
    <div class="zh" id="qZh">你好</div>
    <div class="py" id="qPy">nǐ hǎo</div>
    <div class="hint" id="qHint">Chọn nghĩa</div>
    <div id="qOpts"></div>
    <div id="qReveal"></div>
  </div>
  <div id="hint">Proto B9 · Three.js MIT · CC0 Quaternius · Không liên kết với kỳ thi HSK chính thức · chưa deploy</div>
  <div id="err"></div>
</div>
<script>
window.__B9_NAV = performance.now();
(async () => {
  async function gunzipToObjectURL(url) {
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('fetch ' + url + ' ' + res.status);
    if (typeof DecompressionStream === 'undefined') throw new Error('no DecompressionStream');
    const ab = await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    return URL.createObjectURL(new Blob([ab], { type: 'text/javascript' }));
  }
  let threeUrl;
  try {
    threeUrl = await gunzipToObjectURL('./b9/three.module.min.js.gz');
    console.info('[B9] three gunzip', (performance.now() - window.__B9_NAV).toFixed(0) + 'ms');
  } catch (e) {
    console.warn('[B9] gunzip fallback', e);
    threeUrl = './b9/three.module.min.js';
  }
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { 'three': threeUrl, 'three/addons/': './b9/addons/' } });
  document.head.appendChild(im);
  const mod = document.createElement('script');
  mod.type = 'module';
  mod.src = './b9/app.js';
  mod.onerror = () => { const el = document.getElementById('err'); if (el) { el.style.display = 'block'; el.textContent = 'Không tải được app.js'; } };
  document.head.appendChild(mod);
})();
</script>
</body>
</html>
