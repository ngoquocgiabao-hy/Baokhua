/* Palette moodboard */
const C = {
  waterNear: 0x3DB8C5, waterDeep: 0x1E90C6,
  rockA: 0x8A9A8E, rockB: 0x5C6B73, grass: 0x2F4F4F,
  sun: 0xFFB347, fog: 0xE8F4F8, brand: 0xFFD91F, ink: 0x16171B,
  sky: 0x87CEEB, ground: 0x8A9A8E,
  hero: 0x1E90C6, skin: 0xffdbac, hat: 0xFFD91F
};

const CFG = {
  pixelRatioMax: 1.5,
  fogNear: 18, fogFar: 95,
  camDistMin: 4, camDistMax: 12, camDist: 7.5,
  camPolarMin: THREE.MathUtils.degToRad(10),
  camPolarMax: THREE.MathUtils.degToRad(60),
  moveSpeed: 6.2, joyRadius: 60, joyDead: 0.10,
  lowFpsMs: 4000, lowFpsThresh: 26,
  bloomStrength: 0.45, bloomRadius: 0.35, bloomThresh: 0.82
};

/* B2 assets — Quaternius CC0 via jsDelivr (trebeljahr/quaternius-showcase mirror) */
const ASSET = {
  hero: 'https://cdn.jsdelivr.net/gh/trebeljahr/quaternius-showcase@main/public/glb/modular_men/Worker.glb',
  heroAlt: 'https://cdn.jsdelivr.net/gh/trebeljahr/quaternius-showcase@main/public/glb/modular_women/Casual.glb',
  boss: 'https://cdn.jsdelivr.net/gh/trebeljahr/quaternius-showcase@main/public/glb/platformer_game_pack/Enemy.glb',

};

  bossMax: 320, tutorialBoss: 180, heroMax: 100,
  dmgCorrect: 55, dmgWrong: 15, fastBonus: 12, fastSec: 3,

let mixerHero = null, mixerBoss = null, heroClips = {}, bossClips = {};

};

let toonGrad;
const quality = {
  level: 2, // 2 HQ, 1 mid, 0 low
  pixelRatio: Math.min(devicePixelRatio || 1, CFG.pixelRatioMax),
  bloom: true, waterReflect: true, fog: true
};
const orbit = { theta: 0.55, phi: THREE.MathUtils.degToRad(32), dist: CFG.camDist };
const look = { active: false, id: null, lx: 0, ly: 0 };

window.__PROTO3D = {

  injectMove(x, y) { joy.x = x; joy.y = y; },
  injectOrbit(dt, dp) {
    orbit.theta += dt;
    orbit.phi = THREE.MathUtils.clamp(orbit.phi + dp, CFG.camPolarMin, CFG.camPolarMax);
  },

    if (p != null) orbit.phi = p;

function showErr(m) { errEl.style.display = 'block'; errEl.textContent = m; console.error(m); }

function makeToonGradient() {
  const c = document.createElement('canvas'); c.width = 3; c.height = 1;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(3, 1);
  const px = [0,0,0,255, 140,140,140,255, 255,255,255,255];
  img.data.set(px); ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

function toonMat(color, opts = {}) {
  return new THREE.MeshToonMaterial({
    color, gradientMap: toonGrad,
    emissive: opts.emissive || 0x000000,
    emissiveIntensity: opts.emissiveIntensity || 0,
    ...opts
  });
}

/** Inverted-hull outline (anime) */
function addOutline(mesh, scale = 1.04, color = C.ink) {
  const o = mesh.clone();
  o.material = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
  o.scale.multiplyScalar(scale);
  o.renderOrder = -1;
  mesh.add(o);
  return o;
}

function makeSky() {
  const g = new THREE.SphereGeometry(320, 24, 14);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x4A90C8) },
      mid: { value: new THREE.Color(0xFFB07A) },
      hor: { value: new THREE.Color(0xFFD4A0) },
      bot: { value: new THREE.Color(0xE8F4F8) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `
      uniform vec3 top,mid,hor,bot; varying vec3 vP;
      void main(){
        float h = vP.y;
        vec3 c = mix(bot, hor, smoothstep(-0.15, 0.05, h));
        c = mix(c, mid, smoothstep(0.02, 0.35, h));
        c = mix(c, top, smoothstep(0.25, 0.95, h));
        /* sun disc golden hour */
        vec3 sunDir = normalize(vec3(0.55, 0.22, 0.35));
        float sun = pow(max(0., dot(normalize(vP), sunDir)), 48.0);
        c += vec3(1.0, 0.75, 0.35) * sun * 1.2;
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  return new THREE.Mesh(g, m);
}

function makeWater() {
  const geo = new THREE.PlaneGeometry(280, 280);
  const w = new Water(geo, {
    textureWidth: quality.level >= 2 ? 512 : 256,
    textureHeight: quality.level >= 2 ? 512 : 256,
    waterNormals: new THREE.TextureLoader().load(
      'https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/textures/waternormals.jpg',
      t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    ),
    sunDirection: new THREE.Vector3(0.55, 0.35, 0.4).normalize(),
    sunColor: C.sun,
    waterColor: C.waterDeep,
    distortionScale: quality.level >= 1 ? 3.2 : 1.6,
    fog: false,
    alpha: 0.95
  });
  w.rotation.x = -Math.PI / 2;
  w.position.y = 0;
  /* tint toward Hạ Long teal */
  if (w.material && w.material.uniforms && w.material.uniforms.waterColor) {
    w.material.uniforms.waterColor.value.set(C.waterNear);
  }
  return w;
}

function karstMesh(h, r, color, grassTop) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(r * 0.55, r, h, 6, 1),
    toonMat(color)
  );
  body.position.y = h * 0.5;
  addOutline(body, 1.035);
  g.add(body);
  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(r * 0.55, h * 0.45, 6),
    toonMat(grassTop ? C.grass : color)
  );
  tip.position.y = h + h * 0.2;
  addOutline(tip, 1.04);
  g.add(tip);
  return g;
}

/** Multi-layer karst: near / mid / far silhouettes */
function makeKarstLayers() {
  const near = new THREE.Group();
  const mid = new THREE.Group();
  const far = new THREE.Group();

  const nearPos = [[10, 6], [-12, 4], [8, -9], [-6, -11], [14, -2]];
  nearPos.forEach((p, i) => {
    const m = karstMesh(3.2 + (i % 3) * 0.7, 1.4 + (i % 2) * 0.4, i % 2 ? C.rockA : C.rockB, true);
    m.position.set(p[0], 0, p[1]);
    m.rotation.y = i * 0.7;
    near.add(m);
  });

  const midPos = [[28, 18], [-30, 12], [32, -22], [-24, -28], [0, 34], [-36, -8]];
  midPos.forEach((p, i) => {
    const m = karstMesh(5 + (i % 4), 2.2 + (i % 3) * 0.5, C.rockB, i % 2 === 0);
    m.position.set(p[0], -0.3, p[1]);
    m.scale.setScalar(1.15);
    mid.add(m);
  });

  /* far silhouettes — darker, flatter */
  for (let i = 0; i < 10; i++) {
    const ang = (i / 10) * Math.PI * 2;
    const rad = 70 + (i % 3) * 8;
    const m = karstMesh(8 + (i % 5) * 1.5, 3.5, 0x3a4550, false);
    m.position.set(Math.cos(ang) * rad, -1, Math.sin(ang) * rad);
    m.scale.set(1.6, 1.3 + (i % 3) * 0.25, 1.6);
    far.add(m);
  }

  /* small jetty + boat (procedural, B2 can swap Kenney Watercraft) */
  const dock = new THREE.Mesh(new THREE.BoxGeometry(4, 0.25, 1.2), toonMat(0x8B5A2B));
  dock.position.set(2.5, 0.2, 3.5);
  addOutline(dock, 1.02);
  near.add(dock);
  const boat = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.4, 0.85), toonMat(0xC45C26));
  boat.position.set(5.5, 0.35, 5);
  addOutline(boat, 1.03);
  near.add(boat);

  /* shore strip */
  const shore = new THREE.Mesh(
    new THREE.CircleGeometry(9, 20),
    toonMat(0xC2B280)
  );
  shore.rotation.x = -Math.PI / 2;
  shore.position.y = 0.02;
  near.add(shore);

  return { near, mid, far };
}


function toonifyObject(root, tint = null) {
  root.traverse(obj => {
    if (!obj.isMesh) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    const next = mats.map(m => {
      const col = (tint || (m && m.color) || new THREE.Color(0xffffff));
      const tm = toonMat(col.isColor ? col.getHex() : col, {});
      if (m && m.map) { tm.map = m.map; tm.gradientMap = toonGrad; }
      return tm;
    });
    obj.material = next.length === 1 ? next[0] : next;
    obj.castShadow = false; obj.receiveShadow = false;
    // outline clone (skip skinned complexity — scale parent)
  });
}

function loadGLB(url, local) {
  return new Promise((resolve, reject) => {
    const loader = new GLTFLoader();
    // Draco optional (models may not need it)
    try {
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(draco);
    } catch (_) {}
    const tryUrl = (u, next) => {
      loader.load(u, resolve, undefined, err => {
        console.warn('GLB fail', u, err && err.message);
        if (next) tryUrl(next, null); else reject(err);
      });
    };
    if (local) tryUrl(local, url); else tryUrl(url, null);
  });
}

async function loadCharacters() {
  const banner = document.getElementById('loadBanner');
  try {
    const [heroGltf, bossGltf, boatGltf] = await Promise.all([
      loadGLB(ASSET.hero, ASSET.heroLocal),
      loadGLB(ASSET.boss, ASSET.bossLocal),
      loadGLB(ASSET.boat, ASSET.boatLocal)
    ]);
    // Replace procedural hero
    if (hero && hero.parent) scene.remove(hero);
    hero = heroGltf.scene;
    hero.scale.setScalar(1.15);
    hero.position.set(0, 0, 0);
    toonifyObject(hero, new THREE.Color(C.hero));
    scene.add(hero);
    usingProceduralHero = false;
    if (heroGltf.animations && heroGltf.animations.length) {
      mixerHero = new THREE.AnimationMixer(hero);
      heroGltf.animations.forEach(a => { heroClips[a.name] = a; });
    }
    hero.userData.bob = 0;

    bossMesh = bossGltf.scene;
    bossMesh.scale.setScalar(1.4);
    bossMesh.position.set(8, 0, -6);
    toonifyObject(bossMesh, new THREE.Color(0x8B3A3A));
    scene.add(bossMesh);
    if (bossGltf.animations && bossGltf.animations.length) {
      mixerBoss = new THREE.AnimationMixer(bossMesh);
      bossGltf.animations.forEach(a => { bossClips[a.name] = mixerBoss.clipAction(a); });
      const idle = bossClips['MonsterArmature|Idle'] || Object.values(bossClips)[0];
      if (idle) idle.play();
    }

    boatMesh = boatGltf.scene;
    boatMesh.scale.setScalar(2.2);
    boatMesh.position.set(5.5, 0.05, 5);
    toonifyObject(boatMesh, new THREE.Color(0xC45C26));
    scene.add(boatMesh);

    glbReady = true;
    window.__PROTO3D.glbReady = true;
    if (banner) banner.style.display = 'none';
    console.info('[B2] GLB loaded', ASSET.license);
  } catch (e) {
    console.warn('[B2] GLB fallback procedural', e);
    if (banner) { banner.textContent = 'GLB lỗi — dùng hero procedural'; setTimeout(() => banner.style.display = 'none', 1500); }
    // ensure procedural hero exists
    if (!hero) { hero = makeHero(); scene.add(hero); }
    // simple boss capsule
    bossMesh = new THREE.Group();
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 1.0, 4, 8), toonMat(0x8B3A3A));
    b.position.y = 1.1; addOutline(b, 1.05); bossMesh.add(b);
    bossMesh.position.set(8, 0, -6); scene.add(bossMesh);
    glbReady = false;
    if (banner) setTimeout(() => banner.style.display = 'none', 1200);
  }
}

function floatDmg(text, color, xPct = 50, yPct = 40) {
  const el = document.createElement('div');
  el.className = 'dmg-float'; el.textContent = text; el.style.color = color;
  el.style.left = xPct + '%'; el.style.top = yPct + '%';
  document.getElementById('dmgLayer').appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function syncHpHud() {
  const bp = Math.max(0, combat.boss / combat.bossMax * 100);
  const hp = Math.max(0, combat.hero / combat.heroMax * 100);
  const bb = document.getElementById('bossHpBar'); if (bb) bb.style.width = bp + '%';
  const hb = document.getElementById('heroHpBar'); if (hb) hb.style.width = hp + '%';
  const bt = document.getElementById('bossHpTxt'); if (bt) bt.textContent = Math.ceil(combat.boss) + '/' + combat.bossMax;
  const ht = document.getElementById('heroHpTxt'); if (ht) ht.textContent = Math.ceil(combat.hero) + '/' + combat.heroMax;
  const cl = document.getElementById('comboLab');
  if (cl) cl.textContent = combat.streak >= 5 ? '🔥 COMBO ×2' : combat.streak >= 3 ? '🔥 COMBO ×1.5' : (combat.streak > 0 ? '🔥 x' + combat.streak : '');
}

function bossTelegraphThenHit() {
  if (combat.ended || combat.telegraphOn) return;
  combat.telegraphOn = true;
  const tg = document.getElementById('telegraph');
  if (tg) tg.style.display = 'block';
  // play bite anim if any
  const bite = bossClips['MonsterArmature|Bite_Front'] || bossClips['MonsterArmature|Bite_InPlace'];
  if (bite) { bite.reset(); bite.setLoop(THREE.LoopOnce); bite.clampWhenFinished = true; bite.play(); }
  setTimeout(() => {
    if (tg) tg.style.display = 'none';
    combat.telegraphOn = false;
    if (combat.ended || combat.locked) return;
    combat.hero = Math.max(0, combat.hero - BAL.bossAtkDmg);
    floatDmg('-' + BAL.bossAtkDmg, '#ff7a6e', 35, 48);
    syncHpHud();
    if (combat.hero <= 0) endCombat(false);
  }, BAL.telegraph * 1000);
}

function endCombat(win) {
  combat.ended = true;
  const panel = document.getElementById('qPanel');
  if (panel) {
    panel.style.display = 'block';
    document.getElementById('qZh').textContent = win ? '胜利' : '失败';
    document.getElementById('qPy').textContent = win ? 'shènglì' : 'shībài';
    document.getElementById('qHint').textContent = win ? 'Thắng boss!' : 'Thua — thử lại';
    document.getElementById('qOpts').innerHTML = '';
    const rev = document.getElementById('qReveal');
    rev.classList.add('on');
    rev.textContent = win ? 'Hạ boss · học tiếp nhé' : 'Boss còn mạnh — trả lời nhanh hơn';
  }
  if (win) spawnSkillBurst();
}

function applyAnswer(ok, elapsedSec) {
  if (combat.ended) return;
  let dmg = BAL.dmgCorrect;
  if (ok) {
    combat.streak++;
    if (elapsedSec <= BAL.fastSec) dmg += BAL.fastBonus;
    if (combat.streak >= 5) dmg = Math.round(dmg * BAL.combo5);
    else if (combat.streak >= 3) dmg = Math.round(dmg * BAL.combo3);
    combat.boss = Math.max(0, combat.boss - dmg);
    floatDmg('-' + dmg, '#FFD91F', 62, 36);
    spawnClassFx(combat.classId);
    if (combat.boss <= 0) endCombat(true);
  } else {
    combat.streak = 0;
    combat.hero = Math.max(0, combat.hero - BAL.dmgWrong);
    floatDmg('-' + BAL.dmgWrong, '#ff7a6e', 35, 48);
    if (combat.hero <= 0) endCombat(false);
  }
  syncHpHud();
}

/** B4 class FX particles */
function spawnClassFx(classId) {
  if (!hero || !scene) return;
  const colors = {
    linh_ho: 0x98D8C8,
    kiem_khach: 0x1E90C6,
    thiet_ve: 0xFFD91F
  };
  const col = colors[classId] || C.brand;
  const n = 90;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 0.3;
    pos[i * 3 + 1] = Math.random() * 0.4;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: col, size: 0.16, transparent: true, opacity: 1, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  pts.position.copy(hero.position); pts.position.y += 1.2;
  scene.add(pts);
  const t0 = performance.now();
  (function tick() {
    const t = (performance.now() - t0) / 650;
    if (t >= 1) { scene.remove(pts); geo.dispose(); mat.dispose(); return; }
    const a = geo.attributes.position;
    for (let i = 0; i < n; i++) {
      a.array[i * 3] += (Math.random() - 0.5) * 0.1;
      a.array[i * 3 + 1] += 0.05;
      a.array[i * 3 + 2] += (Math.random() - 0.5) * 0.1;
    }
    a.needsUpdate = true; mat.opacity = 1 - t;
    if (bloomPass && quality.bloom) bloomPass.strength = CFG.bloomStrength + (1 - t) * 0.9;
    requestAnimationFrame(tick);
  })();
  setTimeout(() => { if (bloomPass) bloomPass.strength = quality.bloom ? CFG.bloomStrength : 0; }, 700);
}


function makeHero() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.75, 4, 10), toonMat(C.hero));
  body.position.y = 0.95;
  addOutline(body, 1.06);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), toonMat(C.skin));
  head.position.y = 1.72;
  addOutline(head, 1.07);
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.4, 8), toonMat(C.hat, { emissive: C.hat, emissiveIntensity: 0.15 }));
  hat.position.y = 2.05;
  addOutline(hat, 1.05);
  /* sash accent */
  const sash = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.06, 6, 16), toonMat(0xE63946));
  sash.position.y = 1.05; sash.rotation.x = Math.PI / 2;
  g.add(body, head, hat, sash);
  g.userData.bob = 0;
  return g;
}

/** Skill bloom burst — B4 expands per class */
function spawnSkillBurst() {
  if (!hero) return;
  const geo = new THREE.BufferGeometry();
  const n = 80;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 0.2;
    pos[i * 3 + 1] = Math.random() * 0.5;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: C.brand, size: 0.18, transparent: true, opacity: 1, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  pts.position.copy(hero.position); pts.position.y += 1.2;
  scene.add(pts);
  const t0 = performance.now();
  function tick() {
    const t = (performance.now() - t0) / 700;
    if (t >= 1) { scene.remove(pts); geo.dispose(); mat.dispose(); return; }
    const a = geo.attributes.position;
    for (let i = 0; i < n; i++) {
      a.array[i * 3] += (Math.random() - 0.5) * 0.08;
      a.array[i * 3 + 1] += 0.04 + Math.random() * 0.03;
      a.array[i * 3 + 2] += (Math.random() - 0.5) * 0.08;
    }
    a.needsUpdate = true;
    mat.opacity = 1 - t;
    if (bloomPass && quality.bloom) bloomPass.strength = CFG.bloomStrength + (1 - t) * 0.8;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(() => { if (bloomPass) bloomPass.strength = quality.bloom ? CFG.bloomStrength : 0; }, 750);
}

function applyQuality(level) {
  quality.level = level;
  quality.pixelRatio = level >= 2 ? Math.min(devicePixelRatio || 1, CFG.pixelRatioMax) : 1;
  quality.bloom = level >= 1;
  quality.waterReflect = level >= 1;
  quality.fog = level >= 1;
  renderer.setPixelRatio(quality.pixelRatio);
  if (scene.fog) {
    if (quality.fog) { scene.fog.near = CFG.fogNear; scene.fog.far = CFG.fogFar; }
    else { scene.fog.near = 200; scene.fog.far = 400; }
  }
  if (bloomPass) bloomPass.strength = quality.bloom ? CFG.bloomStrength : 0;
  if (water && water.material && water.material.uniforms && water.material.uniforms.distortionScale) {
    water.material.uniforms.distortionScale.value = level >= 1 ? 3.2 : 1.2;
  }
  qualBtn.textContent = level >= 2 ? 'HQ' : level === 1 ? 'MID' : 'LOW';
}

function init() {
  try {
    toonGrad = makeToonGradient();
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', alpha: false });
    renderer.setPixelRatio(quality.pixelRatio);
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.setClearColor(0x87CEEB, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = false;

    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(C.fog, CFG.fogNear, CFG.fogFar);

    camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.2, 420);

    /* Golden hour */
    const hemi = new THREE.HemisphereLight(C.sky, C.ground, 0.7);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(C.sun, 1.25);
    sun.position.set(45, 28, 20);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xa0c8ff, 0.25);
    fill.position.set(-30, 20, -10);
    scene.add(fill);

    scene.add(makeSky());
    water = makeWater();
    scene.add(water);
    layers = makeKarstLayers();
    scene.add(layers.near, layers.mid, layers.far);
    hero = makeHero();
    scene.add(hero);
    loadCharacters().then(() => { syncHpHud(); window.__PROTO3D.ready = true; });

    /* Post: bloom mobile-safe */
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bs = new THREE.Vector2(Math.min(innerWidth, 720), Math.min(innerHeight, 1280));
    bloomPass = new UnrealBloomPass(bs, CFG.bloomStrength, CFG.bloomRadius, CFG.bloomThresh);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    clock = new THREE.Clock();
    if (innerWidth <= 420) applyQuality(1);
    bindInput();
    qualBtn.onclick = () => applyQuality((quality.level + 2) % 3);
    document.getElementById('skillBtn').onclick = () => {
      if (performance.now() < inputLockUntil) return;
      inputLockUntil = performance.now() + 300;
      spawnClassFx(combat.classId);
      spawnSkillBurst();
    };
    document.getElementById('talkBtn').onclick = () => {
      if (performance.now() < inputLockUntil || combat.ended || combat.locked) return;
      inputLockUntil = performance.now() + 300;
      openQuestion();
    };

    loadQuestions().then(() => { if (!window.__PROTO3D.ready) {/* wait glb */} });
    // ready set after GLB (or fallback) in loadCharacters
    setTimeout(() => { if (!window.__PROTO3D.ready) window.__PROTO3D.ready = true; }, 8000);
    syncHpHud();
    loop();
  } catch (e) {
    showErr('WebGL/init: ' + (e && e.message));
  }
}

  const audio = all.filter(q => q.type === 'audio');
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  if (stage >= 3) {
    const a = shuffle(audio);
    const t = shuffle(text);
    const n = Math.min(t.length, a.length, 10);
    const mix = [];
    for (let i = 0; i < n; i++) { mix.push(t[i], a[i % a.length]); }
    return shuffle(mix);
  }
  // stage 1: 70% text 30% audio of available
  const wantAudio = Math.max(1, Math.round(all.length * 0.3));
  return shuffle(text.concat(shuffle(audio).slice(0, wantAudio)));
}

window.__PROTO3D.buildStagePool = buildStagePool;
async function loadQuestions() {
  // Prefer embedded (single-file). Optional external override if present.
  try {
    const r = await fetch('cau_hoi_v7.json', { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data) && data.length) {
        questions = data.map(normalizeV7);
        window.__PROTO3D.questions = questions;
        console.info('[B3] external cau_hoi_v7.json', questions.length);
        return questions;
      }
    }
  } catch (_) {}
  questions = CAU_HOI_V7.map(normalizeV7);
  window.__PROTO3D.questions = questions;
  console.info('[B3] embedded CAU_HOI_V7', questions.length);
  return questions;
}

function openQuestion() {
  if (!questions.length) questions = CAU_HOI_V7.map(normalizeV7);
  const q = questions[qIndex % questions.length];
  const panel = document.getElementById('qPanel');
  const opts = document.getElementById('qOpts');
  const rev = document.getElementById('qReveal');
  panel.style.display = 'block';
  rev.classList.remove('on'); rev.innerHTML = '';
  combat.qStart = performance.now();
  combat.locked = false;
  /* LAW: text = chu_han + pinyin only; audio = TTS am_thanh; NO nghia/giai_thich before answer */
  const isAudio = q.type === 'audio';
  document.getElementById('qZh').textContent = isAudio ? '🔊' : (q.chu_han || '');
  document.getElementById('qPy').textContent = q.pinyin || '';
  document.getElementById('qHint').textContent = q.cau_hoi || (isAudio ? 'Nghe và chọn' : 'Chọn nghĩa đúng');
  opts.innerHTML = '';
  const n = q.dap_an.length;
  const order = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  order.forEach((orig) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = q.dap_an[orig];
    b.dataset.orig = String(orig);
    b.onclick = () => {
      if (performance.now() < inputLockUntil) return;
      inputLockUntil = performance.now() + 300;
      const ok = orig === q.dung;
      [...opts.querySelectorAll('button')].forEach(btn => {
        if (+btn.dataset.orig === q.dung) btn.style.background = '#5dffb0';
      });
      if (!ok) b.style.background = '#ff7a6e';
      const elapsed = (performance.now() - combat.qStart) / 1000;
      rev.innerHTML = '<b>' + (ok ? '✓ Đúng' : '✗ Sai') + '</b> · ' +
        (q.chu_han || q.am_thanh || '') + '<br><i>' + (q.pinyin || '') + '</i><br>' +
        '<span>' + (q.nghia || '') + '</span><br><small>' + (q.giai_thich || '') + '</small>';
      rev.classList.add('on');
      applyAnswer(ok, elapsed);
      combat.locked = true;
      setTimeout(() => {
        panel.style.display = 'none'; qIndex++; combat.locked = false;
        if (!combat.ended) setTimeout(() => openQuestion(), 400);
      }, 1200);
    };
    opts.appendChild(b);
  });
  if (isAudio && q.am_thanh && window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(q.am_thanh);
    u.lang = 'zh-CN';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
}

function bindInput() {
  const stickZone = document.getElementById('stickZone');
  const lookZone = document.getElementById('lookZone');

  function joyStart(x, y, id) {
    joy.active = true; joy.id = id;
    stickBase.style.display = 'block';
    const r = stickBase.getBoundingClientRect();
    joy.ox = r.left + r.width / 2; joy.oy = r.top + r.height / 2;
    joyMove(x, y);
  }
  function joyMove(x, y) {
    if (!joy.active) return;
    const dx = x - joy.ox, dy = y - joy.oy;
    const len = Math.hypot(dx, dy), max = CFG.joyRadius;
    const nx = len > max ? dx / len * max : dx;
    const ny = len > max ? dy / len * max : dy;
    stickKnob.style.left = (60 + nx) + 'px';
    stickKnob.style.top = (60 + ny) + 'px';
    let jx = nx / max, jy = ny / max;
    const mag = Math.hypot(jx, jy);
    if (mag < CFG.joyDead) { joy.x = 0; joy.y = 0; }
    else {
      const s = (mag - CFG.joyDead) / (1 - CFG.joyDead);
      joy.x = (jx / mag) * s; joy.y = (jy / mag) * s;
    }
  }
  function joyEnd() {
    joy.active = false; joy.id = null; joy.x = 0; joy.y = 0;
    stickKnob.style.left = '60px'; stickKnob.style.top = '60px';
    stickBase.style.display = 'none';
  }

  stickZone.addEventListener('pointerdown', e => { stickZone.setPointerCapture(e.pointerId); joyStart(e.clientX, e.clientY, e.pointerId); });
  stickZone.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e.clientX, e.clientY); });
  stickZone.addEventListener('pointerup', e => { if (e.pointerId === joy.id) joyEnd(); });
  stickZone.addEventListener('pointercancel', e => { if (e.pointerId === joy.id) joyEnd(); });

  lookZone.addEventListener('pointerdown', e => {
    lookZone.setPointerCapture(e.pointerId);
    look.active = true; look.id = e.pointerId; look.lx = e.clientX; look.ly = e.clientY;
  });
  lookZone.addEventListener('pointermove', e => {
    if (!look.active || e.pointerId !== look.id) return;
    const dx = e.clientX - look.lx, dy = e.clientY - look.ly;
    look.lx = e.clientX; look.ly = e.clientY;
    orbit.theta -= dx * 0.005;
    orbit.phi = THREE.MathUtils.clamp(orbit.phi + dy * 0.004, CFG.camPolarMin, CFG.camPolarMax);
  });
  lookZone.addEventListener('pointerup', e => { if (e.pointerId === look.id) { look.active = false; look.id = null; } });
  lookZone.addEventListener('pointercancel', e => { if (e.pointerId === look.id) { look.active = false; look.id = null; } });

  let pinch = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const a = e.touches[0], b = e.touches[1];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), dist: orbit.dist };
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinch) {
      const a = e.touches[0], b = e.touches[1];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      orbit.dist = THREE.MathUtils.clamp(pinch.dist * (pinch.d / d), CFG.camDistMin, CFG.camDistMax);
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { pinch = null; }, { passive: true });

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyQ') openQuestion();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  let md = false;
  canvas.addEventListener('mousedown', e => {
    if (e.button === 0 && e.clientX > innerWidth / 2) { md = true; look.lx = e.clientX; look.ly = e.clientY; }
  });
  addEventListener('mouseup', () => { md = false; });
  addEventListener('mousemove', e => {
    if (!md) return;
    const dx = e.clientX - look.lx, dy = e.clientY - look.ly;
    look.lx = e.clientX; look.ly = e.clientY;
    orbit.theta -= dx * 0.005;
    orbit.phi = THREE.MathUtils.clamp(orbit.phi + dy * 0.004, CFG.camPolarMin, CFG.camPolarMax);
  });
  canvas.addEventListener('wheel', e => {
    orbit.dist = THREE.MathUtils.clamp(orbit.dist + e.deltaY * 0.01, CFG.camDistMin, CFG.camDistMax);
  }, { passive: true });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
    composer.setSize(innerWidth, innerHeight);
  });

  /* tap near NPC/hero to open question (B3 interact ≤3m) */
  lookZone.addEventListener('click', e => {
    if (performance.now() < inputLockUntil) return;
    /* simple: double-purpose — if nearly idle click opens Q */
    if (Math.hypot(joy.x, joy.y) < 0.05) {
      /* ignore — skill button / Q key preferred for now */
    }
  });
}

function updateHero(dt) {
  let mx = joy.x, mz = joy.y;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  const sin = Math.sin(orbit.theta), cos = Math.cos(orbit.theta);
  move.set(mx * cos + mz * sin, 0, -mx * sin + mz * cos);
  if (len > 0.01) {
    hero.position.x += move.x * CFG.moveSpeed * dt;
    hero.position.z += move.z * CFG.moveSpeed * dt;
    hero.position.x = THREE.MathUtils.clamp(hero.position.x, -80, 80);
    hero.position.z = THREE.MathUtils.clamp(hero.position.z, -80, 80);
    hero.rotation.y = Math.atan2(move.x, move.z);
    hero.userData.bob += dt * 10;
    hero.position.y = Math.abs(Math.sin(hero.userData.bob)) * 0.08;
  } else hero.position.y = 0;

  /* subtle parallax on far layer */
  if (layers.far) {
    layers.far.position.x = hero.position.x * 0.08;
    layers.far.position.z = hero.position.z * 0.08;
  }
  if (layers.mid) {
    layers.mid.position.x = hero.position.x * 0.03;
    layers.mid.position.z = hero.position.z * 0.03;
  }
}

function updateCamera() {
  const hx = hero.position.x, hz = hero.position.z;
  const x = hx + orbit.dist * Math.sin(orbit.theta) * Math.sin(orbit.phi);
  const y = hero.position.y + 1.0 + orbit.dist * Math.cos(orbit.phi);
  const z = hz + orbit.dist * Math.cos(orbit.theta) * Math.sin(orbit.phi);
  camera.position.set(x, y, z);
  camera.lookAt(hx, hero.position.y + 1.15, hz);
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (water && water.material && water.material.uniforms && water.material.uniforms.time) {
    water.material.uniforms.time.value += dt;
  }
  updateHero(dt);
  if (mixerHero) mixerHero.update(dt);
  if (mixerBoss) mixerBoss.update(dt);
  // face boss toward hero
  if (bossMesh && hero) {
    const dx = hero.position.x - bossMesh.position.x;
    const dz = hero.position.z - bossMesh.position.z;
    bossMesh.rotation.y = Math.atan2(dx, dz);
  }
  if (!combat.ended && glbReady !== undefined) {
    combat.bossTimer += dt;
    if (combat.bossTimer >= BAL.bossAtkEvery) {
      combat.bossTimer = 0;
      bossTelegraphThenHit();
    }
  }
  updateCamera();
  if (composer && quality.bloom) composer.render();
  else renderer.render(scene, camera);

  const f = dt > 0 ? 1 / dt : 0;
  fpsHist.push(f);
  if (fpsHist.length > 120) fpsHist.shift();
  const avg = fpsHist.reduce((a, b) => a + b, 0) / fpsHist.length;
  const sorted = fpsHist.slice().sort((a, b) => a - b);
  const p5 = sorted[Math.max(0, Math.floor(sorted.length * 0.05))] || 0;
  window.__PROTO3D.fps = f;
  window.__PROTO3D.avgFps = avg;
  window.__PROTO3D.p5 = p5;
  if ((performance.now() / 250 | 0) !== loop._hud) {
    loop._hud = performance.now() / 250 | 0;
    fpsEl.textContent = `FPS ${f.toFixed(0)} · avg ${avg.toFixed(0)} · p5 ${p5.toFixed(0)}`;
  }
  if (avg < CFG.lowFpsThresh && fpsHist.length > 40) {
    lowFpsAcc += dt * 1000;
    if (lowFpsAcc >= CFG.lowFpsMs && quality.level > 0) {
      applyQuality(quality.level - 1);
      lowFpsAcc = 0;
    }
  } else lowFpsAcc = 0;
}

init();
</script>
