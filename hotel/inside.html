  Dựng HOÀN TOÀN bằng code (Three.js r170 tự lưu ở hotel/lib, MIT): khối bo tròn, tô kiểu hoạt hình + viền, nhân vật chibi có khớp.
  Sảnh lúc đầu trống trơn. Mỗi món người chơi mua ở game chính (bàn, hoa, ghế, thảm, sofa, quầy lễ tân…) hiện ra ở đây có hiệu ứng.
  Không lưu gì: game chính gửi danh sách đồ đã mua qua postMessage (cùng nguồn).
    vào : { bk:'state', own:[id…], staff:n, zones:n } · { bk:'place', id } · { bk:'cheer' } · { bk:'pause' } · { bk:'resume' } · { bk:'focus', id }
    ra  : { bk:'ready' } · { bk:'tap', id } (chạm vào đồ → game chính đọc từ tiếng Trung) · { bk:'coin' }
-->

function pose(c, dt) {

  const pickA = deskA && (guests.some(g => g.st === 'desk' || (g.st === 'walk' && !g.seat)) || Math.random() < .35) ? deskA : ok[Math.floor(Math.random() * ok.length)];
  plan.cur = pickA; plan.phase = 'go';
  go(hero, new THREE.Vector3(pickA.at[0], 0, pickA.at[1]), () => { plan.phase = 'do'; plan.t = pickA.t[0] + Math.random() * (pickA.t[1] - pickA.t[0]);
    if (pickA.a === 'wave') hero.wave = 1.6; if (pickA.say) showTag(hero, pickA.say, 2.2); });
}
function heroTick(dt) {
  const idle = walk(hero, dt, 2.6); if (idle && hero.done) { const f = hero.done; hero.done = null; f(); }
  const a = plan.cur;
  hero.act = plan.phase === 'do' && a ? a.a : null; hero.actT = plan.t; hero.actD = a ? a.t[1] : 1;
  if (plan.phase === 'do' && a) { faceTo(hero, a.f, dt); plan.t -= dt;
    if (a.a === 'bow') hero.bow = Math.max(hero.bow || 0, .5 + .5 * Math.sin(T * 3));
    if (a.a === 'play' && Math.random() < dt * 3) sprite(TX.spark, hero.root.position.x + (Math.random() - .5), 2.0, hero.root.position.z - .3, .2, 1.1, new THREE.Vector3((Math.random() - .5) * .3, .7, 0), { add: true });
    if (plan.t <= 0) { plan.phase = 'idle'; plan.t = .6 + Math.random(); } }
  else if (plan.phase === 'idle') { plan.t -= dt; if (plan.t <= 0) nextAct(); }
  hero.bow = Math.max(0, (hero.bow || 0) - dt * 2);
}
/* ---------- nhãn chữ nổi trên đầu (tiếng Trung + pinyin + nghĩa) ---------- */
let tagOf = null, tagT = 0;
function showTag(c, txt, s) { const [zh, rest] = txt.split(' · ').length > 1 ? [txt.split(' ')[0], txt.slice(txt.indexOf(' ') + 1)] : [txt, '']; $('tag').innerHTML = `<span class="zh" lang="zh-CN">${esc(zh)}</span><i>${esc(rest)}</i>`; tagOf = c; tagT = s; $('tag').classList.add('on'); }
const v3 = new THREE.Vector3();
function screenOf(obj, up) { obj.getWorldPosition(v3); v3.y += up; v3.project(cam); return [(v3.x + 1) / 2 * stage.clientWidth, (1 - v3.y) / 2 * stage.clientHeight]; }

/* ---------- tư thế thêm: ngồi, cúi chào ---------- */
const poseBase = pose;
function pose2(c, dt) {
  poseBase(c, dt);
  if (c.sit) { c.hips.position.y = .26; c.legL.rotation.x = c.legR.rotation.x = -1.35; c.torso.rotation.x = -.05; }
  if (c.bow > 0) { c.torso.rotation.x = .55 * Math.min(1, c.bow); c.head.rotation.x = .2 * Math.min(1, c.bow); }
  // thao tác của Ā Bǎo: chơi đàn, đẩy xe hành lý, vươn vai, ngó nghiêng
  if (c.act === 'play') { c.armL.rotation.x = -1.1 + Math.sin(T * 14) * .15; c.armR.rotation.x = -1.1 + Math.cos(T * 13) * .15; c.head.rotation.x = .12; }
  else if (c.act === 'push') { c.armL.rotation.x = -1.25; c.armR.rotation.x = -1.25; c.torso.rotation.x = .25; }
  else if (c.act === 'stretch') { const k = Math.sin(Math.min(1, Math.max(0, (c.actD - c.actT) / 1.2)) * Math.PI); c.armL.rotation.z = -2.6 * k; c.armR.rotation.z = 2.6 * k; }
  else if (c.act === 'look') c.head.rotation.y = Math.sin(T * 1.6) * .35;
}

/* ---------- chạm: vào đồ thì game chính đọc từ, vào sàn thì Ā Bǎo đi tới ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  const r = renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  let best = null;
  for (const id in ITEM3D) for (const g of ITEM3D[id]) { if (!g.visible) continue; const h = ray.intersectObject(g, true)[0]; if (h && (!best || h.distance < best.d)) best = { id, d: h.distance, p: h.point }; }
  const fl = ray.intersectObject(floor)[0];
  if (best && (!fl || best.d < fl.distance + .01)) { post({ bk: 'tap', id: best.id }); sparkles(best.p.x, best.p.y, best.p.z, 8, .3); return; }
  if (!fl) return;
  const p = fl.point; p.x = THREE.MathUtils.clamp(p.x, .7, ROOM.w - .5); p.z = THREE.MathUtils.clamp(p.z, .7, ROOM.d - .4);
  if (own.has('desk') && p.x > 5.5 && p.x < 9.3 && p.z > 1.15 && p.z < 2.35) p.z = p.z < 1.75 ? 1.0 : 2.55;
  plan.cur = null; plan.phase = 'tap'; go(hero, p, () => { plan.phase = 'idle'; plan.t = 5; });
  sprite(TX.spark, p.x, .1, p.z, .35, .5, new THREE.Vector3(0, .5, 0), { add: true });
});

/* =====================================================================
   VÒNG CẬP NHẬT
   ===================================================================== */
let T = 0, bayT = 0;
function update(dt) {
  T += dt;
  heroTick(dt); pose2(hero, dt);
  staff.forEach((s, i) => { faceTo(s, 0, dt); if (guests.some(g => g.st === 'desk') && Math.random() < dt * .5) s.bow = 1; s.bow = Math.max(0, (s.bow || 0) - dt * 1.5); pose2(s, dt); });
  spawnT -= dt; const cap = Math.min(3, 1 + Math.floor(own.size / 5));
  if (spawnT <= 0 && guests.length < cap && own.size) { newGuest(); spawnT = 5 + Math.random() * 5; }
  for (let i = guests.length - 1; i >= 0; i--) { guestTick(guests[i], dt); if (guests[i]) pose2(guests[i], dt); }
  bell.scale.y += (1 - bell.scale.y) * Math.min(1, dt * 10);
  plants.forEach(p => { p.top.rotation.z = Math.sin(T * 1.3 + p.ph) * .05; p.top.rotation.x = Math.cos(T * 1.1 + p.ph) * .04; });
  petals.forEach(p => { p.f.position.y = .5 + Math.sin(T * 2 + p.ph) * .012; });
  fishes.forEach(f => { const a = T * .8 + f.ph; f.f.position.set(Math.sin(a * 1.3) * .14, f.y + Math.sin(a * 2) * .05, Math.sin(a) * .42); f.f.rotation.y = Math.cos(a) > 0 ? 0 : Math.PI; });
  if (teaset.visible && Math.random() < dt * 2.2 && !REDUCED) cups.forEach(c => { const p = c.getWorldPosition(new THREE.Vector3()); sprite(TX.puff, p.x, p.y + .08, p.z, .1, 1.2, new THREE.Vector3(.03, .25, 0), { grow: 1.6 }); });
  if (fountain.visible && !REDUCED && Math.random() < dt * 9) { const a = Math.random() * 6.28; sprite(TX.dot, 4.4 + Math.cos(a) * .2, 1.1, 7.0 + Math.sin(a) * .2, .12, .7, new THREE.Vector3(Math.cos(a) * .5, 1.0, Math.sin(a) * .5), { grav: 3.2, add: true }); }
  water.scale.setScalar(1 + Math.sin(T * 3) * .01);
  catPaw.rotation.x = Math.sin(T * 4) * .6;
  for (let i = 0; i < MOTE_N; i++) { const s = moteSeed[i]; motePos[i * 3] = s[0] + Math.sin(T * .3 + s[3]) * .2; motePos[i * 3 + 1] = s[1] + Math.sin(T * .2 + s[3] * 2) * .25; motePos[i * 3 + 2] = s[2] + Math.cos(T * .25 + s[3]) * .2; }
  moteGeo.attributes.position.needsUpdate = true;
  beams.forEach((b, i) => b.material.opacity = .45 + Math.sin(T * .7 + i) * .1);
  glows.forEach((g, i) => g.material.opacity = .7 + Math.sin(T * 2 + i) * .08);
  const now = new Date(); hHand.rotation.z = -((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2; mHand.rotation.z = -(now.getMinutes() + now.getSeconds() / 60) / 60 * Math.PI * 2;
  liftOpen = Math.max(0, liftOpen - dt); const lk = Math.sin(Math.min(1, (1 - liftOpen) * 1.0) * Math.PI) * (liftOpen > 0 ? 1 : 0); doorL.position.z = -.4 - .35 * lk; doorR.position.z = .4 + .35 * lk; liftLamp.material.color.set(liftOpen > 0 ? '#ffd27a' : '#7fffb0');
  bayT += dt; if (bayT > .1) { drawBay(T); bayT = 0; }
  stepFx(dt); stepPops(dt);
  // nhãn chữ trên đầu
  if (tagT > 0) { tagT -= dt; const [x, y] = screenOf(tagOf.head, .95); $('tag').style.left = x + 'px'; $('tag').style.top = y + 'px'; if (tagT <= 0) $('tag').classList.remove('on'); }
  // máy quay: màn dọc đi theo Ā Bǎo, vừa mua đồ thì lia tới món mới
  focusT = Math.max(0, focusT - dt);
  if (stage.clientWidth < stage.clientHeight || focusT > 0) {
    const hp = hero.root.position, f = focusT > 0 && focusAt ? focusAt : null;
    const tx = THREE.MathUtils.clamp(f ? f.x : hp.x * .7 + 5 * .3, 3.0, 7.4), tz = THREE.MathUtils.clamp(f ? f.z : hp.z * .7 + 4 * .3, 2.0, 6.4);
    camAt.x += (tx - camAt.x) * Math.min(1, dt * 2.4); camAt.z += (tz - camAt.z) * Math.min(1, dt * 2.4); placeCam();
  }
}
function render() { renderer.render(scene, cam); }

/* ---------- nhận lệnh từ game chính ---------- */
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || !e.data.bk) return;
  const d = e.data;
  if (d.bk === 'state') { own = new Set(d.own || []); staffN = d.staff | 0; applyOwn(); }
  else if (d.bk === 'place') place(d.id);
  else if (d.bk === 'cheer') { hero.joy = 1.6; confetti(hero.root.position.x, 2.4, hero.root.position.z, 60); }
  else if (d.bk === 'focus') { focusAt = centerOf(d.id); focusT = 2.2; }
  else if (d.bk === 'pause') paused = true;
  else if (d.bk === 'resume') { if (paused) { paused = false; last = performance.now(); requestAnimationFrame(loop); } }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !paused) { last = performance.now(); requestAnimationFrame(loop); } });

/* ---------- chạy ---------- */
for (const id in ITEM3D) ITEM3D[id].forEach(g => { g.visible = false; });
applyOwn(); fit();
let last = performance.now(), running = false;
function loop(now) { if (paused || document.hidden) { running = false; return; } running = true; const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
post({ bk: 'ready' });
window.__inside = { place, get own() { return [...own]; }, ITEM3D, hero, get guests() { return guests.length; }, get plan() { return plan.cur && plan.cur.a; }, step(dt = 1 / 30, n = 1) { for (let i = 0; i < n; i++) update(dt); render(); } };
</script>
