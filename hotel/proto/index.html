<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Khách sạn Vịnh Ā Bǎo – bản thử 3D</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFD91F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ā Bǎo Hotel">
<!--
  Bản thử giai đoạn 0 · v0.2 (06/11/2026): sảnh khách sạn 3D dựng HOÀN TOÀN bằng code (Three.js r170 tự lưu, MIT).
  - Hình: khối bo tròn, tô màu kiểu hoạt hình (toon) + viền, nhân vật chibi có khớp thật (chớp mắt, vui, buồn, vẫy tay).
  - Học: giáo trình 6 bài HSK0 → HSK4 (COURSE), mỗi khách hỏi 1 câu của bài đang mở; đúng thì thẻ từ vào Bộ thẻ.
  - Ôn tập kiểu Anki (SM-2 rút gọn): Lại / Khó / Được / Dễ; "Hôm nay cần ôn" + nhắc ôn (huy hiệu app, thông báo, lịch .ics).
  - Cài như app (PWA): manifest.webmanifest + sw.js. ?capture=1: chế độ quay video (tools/hotel/capture.js).
  Câu hỏi là luyện tập theo khung HSK, không phải đề thi chính thức. Xu, sao chỉ dùng trong game.
-->
<style>
:root{--ink:#2b2233;--sun:#FFD91F;--peach:#ffb38a;--mint:#7fd6c2;--sky:#cfeaf7;--cream:#fff7e8;--rose:#ff7fa0;--denim:#1E5AA8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--sky);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:var(--ink)}
[lang^="zh"]{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 30%,#e9f7ff 0%,#cfeaf7 55%,#b9dcef 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(130% 95% at 50% 45%,transparent 60%,rgba(43,34,51,.16) 100%)}
/* HUD */
.hud{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start;z-index:5;pointer-events:none}
.brand{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);flex:1;min-width:0}
.brand b{display:block;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 10px;font-weight:900;font-size:13.5px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill.coin{background:var(--sun)}
.pill .bar{width:44px;height:7px;border-radius:9px;background:#f1e6d4;overflow:hidden;border:1.5px solid var(--ink)}
.pill .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf3a,#ff9f43);transition:width .5s}
.bump{animation:bump .4s cubic-bezier(.3,1.8,.5,1)}@keyframes bump{40%{transform:scale(1.2)}}
.side{position:fixed;right:10px;top:calc(96px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:22px;z-index:5}
.fab{position:relative;width:52px;height:52px;border-radius:18px;border:2.5px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-size:23px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.fab small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;white-space:nowrap;background:rgba(255,255,255,.9);padding:0 4px;border-radius:5px}
.fab .badge{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;border-radius:11px;background:var(--rose);color:#fff;font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);padding:0 4px}
.fab .badge[hidden]{display:none}
.fab.wiggle{animation:wig 1.6s ease-in-out infinite}@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-9deg)}85%{transform:rotate(8deg)}92%{transform:rotate(-4deg)}}
.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(43,34,51,.86);color:#fff;font-size:12.5px;padding:7px 13px;border-radius:999px;z-index:4;white-space:nowrap;pointer-events:none;transition:opacity .4s}
/* bóng nói */
.bubble{position:fixed;z-index:4;transform:translate(-50%,-100%) scale(.6);transform-origin:50% 100%;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:6px 11px 7px;font-size:12px;line-height:1.3;box-shadow:0 3px 0 var(--ink);pointer-events:none;max-width:250px;text-align:center;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.3,1.7,.5,1)}
.bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble .zh{font-size:16px;font-weight:800;display:block;white-space:nowrap}
.bubble .py{font-style:italic;color:var(--denim);display:block}
.bubble .vi{display:block;opacity:.85}
.key{color:#e8590c}
/* câu hỏi khi đón khách */
.ask{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:11px 12px 12px;transform:translateY(130%);transition:transform .35s cubic-bezier(.3,1.3,.5,1);max-width:520px;margin:0 auto}
.ask.on{transform:none}
.ask .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ask .tag{font-size:10.5px;font-weight:900;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
.ask .q{font-size:13px;font-weight:700;flex:1}
.ask .say{border:2px solid var(--ink);background:var(--cream);border-radius:12px;width:38px;height:34px;font-size:17px;flex:none}
.ask .line{text-align:center;margin:2px 0 8px}
.ask .line .zh{font-size:21px;font-weight:900;display:block}
.ask .line .py{font-style:italic;color:var(--denim);font-size:13px}
.ask .opts{display:grid;gap:7px}
.ask .opts button{border:2.5px solid var(--ink);background:var(--cream);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px;text-align:left;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.ask .opts button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ask .opts button.ok{background:#b8f0c8}.ask .opts button.no{background:#ffc9cf}
.ask .opts.done button{pointer-events:none}
.ask .res{display:none;margin-top:8px;font-size:12.5px;text-align:center;font-weight:700}
.ask .res.on{display:block}
/* toast lớn */
.toast{position:fixed;left:50%;top:38%;z-index:8;transform:translate(-50%,-50%) scale(.4);opacity:0;background:var(--sun);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px 18px;text-align:center;font-weight:900;font-size:18px;pointer-events:none;transition:opacity .25s,transform .45s cubic-bezier(.3,1.8,.5,1);width:max-content;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{display:block;font-size:12.5px;font-weight:700;margin-top:3px}
/* nhắc ôn */
.remind{position:fixed;left:10px;right:76px;top:calc(96px + env(safe-area-inset-top));z-index:5;background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center;transform:translateX(-120%);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.remind.on{transform:none}
.remind b{color:#e8590c}
.remind button{border:2px solid var(--ink);background:var(--sun);border-radius:10px;padding:5px 9px;font-weight:900;font-size:12px;white-space:nowrap}
.remind .x{background:#fff;padding:5px 7px}
/* bảng Thẻ từ */
.sheet{position:fixed;inset:0;z-index:9;background:rgba(43,34,51,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;top:calc(44px + env(safe-area-inset-top));background:var(--cream);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.3,1.2,.5,1);max-width:560px;margin:0 auto}
.sheet.on .panel{transform:none}
.sheet .head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.sheet .head h3{flex:1;font-size:17px}
.sheet .close{border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:5px 10px;font-weight:900;box-shadow:0 2px 0 var(--ink)}
.tabs{display:flex;gap:6px;padding:0 12px 10px}
.tabs button{flex:1;border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 6px;font-weight:800;font-size:12.5px;white-space:nowrap}
.tabs button.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.body{flex:1;overflow:auto;padding:4px 14px 30px;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin:14px 0 7px}
.note{font-size:11.5px;opacity:.75;margin-top:10px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2.5px solid var(--ink);background:var(--sun);border-radius:14px;padding:9px 13px;font-weight:900;font-size:13.5px;box-shadow:0 3px 0 var(--ink);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.alt{background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
/* thẻ lật 3D */
.flip{perspective:900px;height:248px;margin:6px auto 12px;max-width:340px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.flip.back .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;background:#fff}
.face.f{background:linear-gradient(160deg,#fff 0%,#fff3d6 100%)}
.face.b{transform:rotateY(180deg);background:linear-gradient(160deg,#fff 0%,#e3f6ff 100%)}
.face .hz{font-size:54px;font-weight:900;line-height:1.1}
.face .lv{position:absolute;top:10px;left:12px;font-size:10.5px;font-weight:900;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.face .tap{position:absolute;bottom:10px;font-size:11px;opacity:.6}
.face .spk{position:absolute;top:8px;right:10px;border:2px solid var(--ink);background:var(--sun);border-radius:12px;width:38px;height:34px;font-size:17px}
.face .py{font-size:22px;font-style:italic;color:var(--denim);font-weight:700}
.face .vi{font-size:18px;font-weight:900;margin:4px 0 10px}
.face .ex{font-size:12.5px;line-height:1.45;border-top:2px dashed rgba(43,34,51,.2);padding-top:8px;width:100%}
.face .ex .zh{font-size:16px;font-weight:800;display:block}
.face .ex i{color:var(--denim);display:block}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:400px;margin:0 auto}
.grades button{border:2.5px solid var(--ink);border-radius:14px;padding:8px 2px 7px;font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--ink);background:#fff;line-height:1.2}
.grades button small{display:block;font-size:10.5px;font-weight:700;opacity:.7}
.grades .g0{background:#ffc9cf}.grades .g1{background:#ffe1b0}.grades .g2{background:#c8f2d4}.grades .g3{background:#c9e8ff}
.grades[hidden]{display:none}
.stat{display:flex;gap:8px;margin:2px 0 8px}
.stat div{flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 8px;text-align:center;box-shadow:0 3px 0 var(--ink)}
.stat b{display:block;font-size:20px}
.stat small{font-size:10.5px;font-weight:700;opacity:.7}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mini{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--ink);min-height:70px}
.mini .zh{font-size:19px;font-weight:900;display:block}
.mini small{font-size:10.5px;color:var(--denim);font-style:italic;display:block}
.mini.lock{background:#efe7da;opacity:.65;box-shadow:none}
.mini.new{background:#fffbe6}
.mini .due{display:inline-block;margin-top:2px;font-size:9.5px;font-weight:900;background:var(--rose);color:#fff;border-radius:6px;padding:0 5px}
.unit{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:9px;box-shadow:0 3px 0 var(--ink);display:flex;gap:10px;align-items:center}
.unit .no{width:42px;height:42px;border-radius:13px;border:2.5px solid var(--ink);background:var(--sun);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex:none}
.unit.lock{background:#f4ede2}.unit.lock .no{background:#ddd}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-size:14px}
.unit .t small{display:block;font-size:11.5px;opacity:.75}
.unit .pb{height:8px;border-radius:9px;background:#f1e6d4;border:1.5px solid var(--ink);margin-top:5px;overflow:hidden}
.unit .pb i{display:block;height:100%;background:linear-gradient(90deg,#7fd6c2,#3fb39b)}
select{border:2.5px solid var(--ink);border-radius:12px;padding:7px 8px;font-weight:800;background:#fff;font-size:13px}
#vid{position:fixed;inset:0;z-index:12;background:rgba(0,10,20,.9);display:none;align-items:center;justify-content:center;padding:16px}
#vid.on{display:flex}#vid video{max-width:100%;max-height:86vh;border-radius:14px;border:3px solid #fff}
#vid button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
body.capture .hint,body.capture .side,body.capture .remind{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="vig"></div>
<div class="hud">
  <div class="brand"><b>Khách sạn Vịnh Ā Bǎo</b><small><span lang="zh-CN">阿宝海湾酒店</span> · Ā Bǎo hǎiwān jiǔdiàn</small></div>
  <div class="pills">
    <div class="pill coin" id="coins">💰 0</div>
    <div class="pill" id="stars"><span id="starTx">0★</span><span class="bar"><i id="starBar"></i></span></div>
  </div>
</div>
<div class="side">
  <button type="button" class="fab" id="cardsBtn" aria-label="Thẻ từ và ôn tập">📚<span class="badge" id="dueBadge" hidden>0</span><small>Thẻ từ</small></button>
  <button type="button" class="fab" id="muteBtn" aria-label="Tắt hoặc bật tiếng">🔊<small>Âm thanh</small></button>
  <button type="button" class="fab" id="vidBtn" aria-label="Xem video">🎬<small>Video</small></button>
</div>
<div class="remind" id="remind"><span>📚 Hôm nay có <b id="remindN">0</b> thẻ cần ôn</span><button type="button" id="remindGo">Ôn ngay</button><button type="button" class="x" id="remindX" aria-label="Để sau">✕</button></div>
<div class="bubble" id="bGuest"></div>
<div class="bubble" id="bHero"></div>
<div class="hint" id="hint">Chạm sàn để Ā Bǎo ra quầy đón khách</div>
<div class="ask" id="ask" aria-live="polite">
  <div class="top"><span class="tag" id="askTag">Bài 1</span><span class="q" id="askQ">Khách vừa nói gì?</span><button type="button" class="say" id="askSay" aria-label="Nghe lại">🔊</button></div>
  <div class="line" id="askLine"></div>
  <div class="opts" id="askOpts"></div>
  <div class="res" id="askRes"></div>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="head"><h3 id="sheetTitle">📚 Thẻ từ của Ā Bǎo</h3><button type="button" class="close" id="sheetClose">Đóng</button></div>
    <div class="tabs"><button type="button" data-tab="review" class="on">Ôn hôm nay</button><button type="button" data-tab="deck">Bộ thẻ</button><button type="button" data-tab="course">Giáo trình</button></div>
    <div class="body" id="sheetBody"></div>
  </div>
</div>
<div id="vid"><video id="vidEl" controls playsinline loop preload="none"></video><button type="button" class="btn" id="vidClose">Đóng</button></div>

<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';

const CAPTURE = /[?&]capture=1/.test(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (CAPTURE) document.body.classList.add('capture');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =====================================================================
   GIÁO TRÌNH (luyện tập theo khung HSK, không phải đề thi chính thức)
   Mỗi bài gắn với 1 mức sao của khách sạn: lên sao thì mở bài mới, khách mới nói câu của bài đó.
   Thẻ: zh · py · vi · ex [câu mẫu Hán, pinyin, nghĩa Việt] – câu mẫu luôn chứa từ của thẻ.
   ===================================================================== */
const COURSE = [
  { id: 'u1', lv: 'HSK0', star: 0, title: 'Chào hỏi', zone: 'Sảnh đón', reply: ['欢迎光临！', 'Huānyíng guānglín!', 'Chào mừng quý khách!'], cards: [
    { id: 'nihao', zh: '你好', py: 'nǐ hǎo', vi: 'xin chào', ex: ['你好，欢迎光临！', 'Nǐ hǎo, huānyíng guānglín!', 'Xin chào, chào mừng quý khách!'] },
    { id: 'xiexie', zh: '谢谢', py: 'xièxie', vi: 'cảm ơn', ex: ['谢谢您！', 'Xièxie nín!', 'Cảm ơn quý khách!'] },
    { id: 'huanying', zh: '欢迎', py: 'huānyíng', vi: 'chào mừng', ex: ['欢迎来到下龙湾！', 'Huānyíng lái dào Xiàlóng Wān!', 'Chào mừng đến vịnh Hạ Long!'] },
    { id: 'zaijian', zh: '再见', py: 'zàijiàn', vi: 'tạm biệt', ex: ['再见，明天见！', 'Zàijiàn, míngtiān jiàn!', 'Tạm biệt, mai gặp lại!'] },
    { id: 'duibuqi', zh: '对不起', py: 'duìbuqǐ', vi: 'xin lỗi', ex: ['对不起，请等一下。', 'Duìbuqǐ, qǐng děng yíxià.', 'Xin lỗi, xin đợi một chút.'] },
    { id: 'bukeqi', zh: '不客气', py: 'bú kèqi', vi: 'không có gì', ex: ['不客气，祝您愉快！', 'Bú kèqi, zhù nín yúkuài!', 'Không có gì, chúc quý khách vui vẻ!'] },
  ] },

/* ---------- vòng cập nhật ---------- */
let bayT = 0;
function update(dt) {
  T += dt;
  if (!guest) newGuest();
  if (!autopilot && T - lastTap > 6 && !$('sheet').classList.contains('on')) autopilot = true;
  if (autopilot && !atDesk() && !hero.target && !hero.path.length) { const hp = hero.root.position; hero.path = (hp.z < 1.4 && hp.x > 5.6) ? [DESK_SPOT.clone()] : [new THREE.Vector3(5.2, 0, 2.6), new THREE.Vector3(5.2, 0, 1.0), DESK_SPOT.clone()]; }
  const heroIdle = walk(hero, dt, 2.6); if (heroIdle && atDesk()) faceTo(hero, 0, dt); pose(hero, dt);
  pt += dt; askT += dt;
  const gDone = walk(guest, dt, 1.8); pose(guest, dt);
  if (phase === 'arrive' && gDone) { phase = 'wait'; pt = 0; const p = guest.head.getWorldPosition(new THREE.Vector3()); sprite(TX.bang, p.x, p.y + 1.05, p.z, .35, 1.0, new THREE.Vector3(0, .3, 0)); SFX.pop(); }
  if (phase === 'wait') { faceTo(guest, Math.PI, dt); if (atDesk() && pt > .4) { phase = 'ask'; pt = 0; SFX.ding(); bell.scale.y = .7; openAsk(); } }
  if (phase === 'ask') { faceTo(guest, Math.PI, dt); if (CAPTURE && pt > 1.6) answer(true, null, [...$('askOpts').children].findIndex(b => b.textContent === cur.ex[2])); }
  if (phase === 'reply') { faceTo(guest, Math.PI, dt); if (pt > .3 && pt - dt <= .3) { hero.wave = 1.6; if (answered) hearts(guest.root.position.x, 1.9, guest.root.position.z, 4); }
    if (pt > 2.4) { closeAsk(); phase = 'pay'; pt = 0; if (answered) coins3d(GUEST_SPOT.x, 1.3, 1.85, 3); } }
  if (phase === 'pay' && pt > 1.0) { phase = 'leave'; pt = 0; guest.wave = 1.6; guest.path = [new THREE.Vector3(5.6, 0, 3.6), LIFT.clone()]; S.served++; save(); }
  if (phase === 'leave' && gDone && pt > 1) { phase = 'out'; pt = 0; doorL.position.z = -.4; }
  if (phase === 'out') { const k = Math.min(1, pt * 2); doorL.position.z = -.4 - .35 * Math.sin(k * Math.PI); doorR.position.z = .4 + .35 * Math.sin(k * Math.PI); guest.root.scale.setScalar(Math.max(.01, 1 - pt * 2.2)); if (pt > .6) { gi++; newGuest(); } }
  bell.scale.y += (1 - bell.scale.y) * Math.min(1, dt * 10);
  // bóng nói
  const [gx, gy] = screenOf(guest.head, .82), [hx, hy] = screenOf(hero.head, .82), bg = $('bGuest'), bh = $('bHero');
  bg.style.left = gx + 'px'; bg.style.top = gy + 'px'; bh.style.left = hx + 'px'; bh.style.top = hy + 'px';
  say(bg, cur && cur.ex, phase === 'wait', cur && cur.zh);
  say(bh, cur && cur.unit.reply, phase === 'reply' && pt > .3 && answered);
  // sống động: cây đung đưa, cá bơi, khói trà, bụi sáng, tia nắng, đồng hồ, cửa sổ
  plants.forEach(p => { p.top.rotation.z = Math.sin(T * 1.3 + p.ph) * .05; p.top.rotation.x = Math.cos(T * 1.1 + p.ph) * .04; });
  fishes.forEach(f => { const a = T * .8 + f.ph; f.f.position.set(Math.sin(a * 1.3) * .14, f.y + Math.sin(a * 2) * .05, Math.sin(a) * .42); f.f.rotation.y = Math.cos(a) > 0 ? 0 : Math.PI; });
  if (Math.random() < dt * 2.2 && !REDUCED) cups.forEach(c => { const p = c.getWorldPosition(new THREE.Vector3()); sprite(TX.puff, p.x, p.y + .08, p.z, .1, 1.2, new THREE.Vector3(.03, .25, 0), { grow: 1.6 }); });
  for (let i = 0; i < MOTE_N; i++) { const s = moteSeed[i]; motePos[i * 3] = s[0] + Math.sin(T * .3 + s[3]) * .2; motePos[i * 3 + 1] = s[1] + Math.sin(T * .2 + s[3] * 2) * .25; motePos[i * 3 + 2] = s[2] + Math.cos(T * .25 + s[3]) * .2; }
  moteGeo.attributes.position.needsUpdate = true;
  beams.forEach((b, i) => b.material.opacity = .45 + Math.sin(T * .7 + i) * .1);
  glows.forEach((g, i) => g.material.opacity = .7 + Math.sin(T * 2 + i) * .08);
  const now = new Date(); hHand.rotation.z = -((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2; mHand.rotation.z = -(now.getMinutes() + now.getSeconds() / 60) / 60 * Math.PI * 2;
  liftLamp.material.color.set(phase === 'out' ? '#ffd27a' : '#7fffb0');
  bayT += dt; if (bayT > (CAPTURE ? 0 : .1)) { drawBay(T); bayT = 0; }
  stepFx(dt); popUnlocks(dt);
  // máy quay đi theo Ā Bǎo trên màn dọc; khi hỏi thì nhích lên cho bảng câu hỏi không che nhân vật
  if (stage.clientWidth < stage.clientHeight) {
    const hp = hero.root.position, gp = guest.root.position, asking = phase === 'ask' || phase === 'reply';
    const tx = THREE.MathUtils.clamp(hp.x * .55 + gp.x * .25 + 5 * .2, 3.2, 7.2), tz = THREE.MathUtils.clamp(hp.z * .55 + gp.z * .25 + 4 * .2 + (asking ? 1.3 : 0), 2.2, 6.2);
    camAt.x += (tx - camAt.x) * Math.min(1, dt * 2.2); camAt.z += (tz - camAt.z) * Math.min(1, dt * 2.2); placeCam();
  }
  if (CAPTURE) { const z = .88 + Math.min(1, T / 2.5) * .12; if (Math.abs(z - zoom) > 1e-4) { zoom = z; fit(); }
    if (T > 14.2 && !update.shown) { update.shown = true; openSheet('course'); } }   // video: kết bằng màn Giáo trình
}

  catch (e) { toast('Trình duyệt chặn tải tệp', 2000); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && swReg && swReg.active && S.remind) { syncSW(); setTimeout(() => { try { swReg.active.postMessage('remind'); } catch (e) {} }, 500); } });
// nhắc ngay khi mở: banner "Hôm nay có N thẻ cần ôn"
function remindBanner() { const n = dueList().length; if (!n || CAPTURE) return; $('remindN').textContent = n; $('remind').classList.add('on'); setTimeout(() => $('remind').classList.remove('on'), 9000); }
$('remindGo').onclick = () => { $('remind').classList.remove('on'); openSheet('review'); };
$('remindX').onclick = () => $('remind').classList.remove('on');
$('muteBtn').onclick = () => { S.mute = !S.mute; $('muteBtn').firstChild.textContent = S.mute ? '🔇' : '🔊'; save(); if (S.mute && 'speechSynthesis' in window) speechSynthesis.cancel(); };
$('muteBtn').firstChild.textContent = S.mute ? '🔇' : '🔊';
$('askSay').onclick = () => cur && speak(cur.ex[0]);
$('vidBtn').onclick = () => { const v = $('vidEl'); if (!v.src) v.src = 'teaser.mp4'; $('vid').classList.add('on'); v.play().catch(() => {}); };
$('vidClose').onclick = () => { $('vid').classList.remove('on'); $('vidEl').pause(); };

/* ---------- chạy ---------- */
fit(); hud();
if (location.hash === '#on-tap') setTimeout(() => openSheet('review'), 600); else setTimeout(remindBanner, 1500);
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }
if (CAPTURE) { window.__step = (dt = 1 / 30) => { update(dt); render(); }; window.__ready = true; render(); } else requestAnimationFrame(loop);
window.__proto = { S, COURSE, CARD, grade, nextIvl, dueList, dueNow, dayStart, starLv, openSheet, closeSheet, hud, UNLOCK, renderSheet, answer: i => { const b = [...$('askOpts').children][i]; if (b) b.click(); }, get phase() { return phase; }, get cur() { return cur; }, hero, get guest() { return guest; } };
</script>
