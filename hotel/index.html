.overlay.on{display:flex}
.ov-card{background:radial-gradient(circle at 50% 0%,#2a6d93,#0d2a3d 72%);border:3px solid #FFD91F;border-radius:22px;padding:18px 14px 14px;width:100%;max-width:400px;text-align:center;animation:clearIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes clearIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ov-card h3{font-size:26px;font-weight:900;color:#FFD91F;text-shadow:0 3px 0 #16171B}
.ov-card .big{font-size:56px;margin:6px 0;animation:spinIn .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes spinIn{from{transform:scale(.2) rotate(-200deg)}to{transform:none}}
.ov-card p{font-size:14px;opacity:.92;line-height:1.45;margin:6px 0}
.ov-card .btn{margin-top:10px}
.unlock-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.unlock-list span{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.fx-dot{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;will-change:transform,opacity}
.fx-txt{position:absolute;left:0;top:0;font-weight:900;font-size:20px;color:#FFD91F;text-shadow:0 2px 0 #16171B;white-space:nowrap;will-change:transform,opacity}
.fx-coin{position:absolute;left:0;top:0;font-size:20px;will-change:transform,opacity}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.72);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;white-space:nowrap;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ===== giao diện v5: rực rỡ hơn, vẫn nhẹ máy (không làm mờ nền, chỉ gradient + đổ bóng tĩnh) ===== */
body{background:#072538 radial-gradient(120% 55% at 50% 24%,#15638f 0%,#0b3d5c 46%,#072538 100%) no-repeat}
.hud{background:linear-gradient(180deg,rgba(8,40,62,.96) 72%,rgba(8,40,62,0))}
.pill{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 3px 0 rgba(0,0,0,.28)}
.pill.coin{text-shadow:0 0 10px rgba(255,217,31,.5)}
.pill.sat{gap:4px;cursor:pointer;transition:border-color .3s,background .3s}
.pill.sat.good{border-color:rgba(61,209,122,.6);background:linear-gradient(180deg,rgba(61,209,122,.3),rgba(61,209,122,.07))}
.pill.sat.mid{border-color:rgba(255,211,77,.6);background:linear-gradient(180deg,rgba(255,211,77,.28),rgba(255,211,77,.06))}
.pill.sat.bad{border-color:rgba(255,90,90,.7);background:linear-gradient(180deg,rgba(255,90,90,.34),rgba(255,90,90,.07));animation:satBad 1.4s ease-in-out infinite}
.pill.sat.up{animation:satUp .6s ease-out}
.pill.sat.down{animation:satDown .55s ease-out}
@keyframes satUp{40%{transform:scale(1.2);box-shadow:0 0 18px rgba(61,209,122,.95)}}
@keyframes satDown{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}70%{box-shadow:0 0 16px rgba(255,90,90,.95)}}
@keyframes satBad{50%{box-shadow:0 0 14px rgba(255,90,90,.7)}}
.mini{position:relative}
.mini:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shim 2.8s linear infinite;pointer-events:none}
@keyframes shim{to{transform:translateX(100%)}}
.scene-wrap{border:2px solid rgba(255,217,31,.8);border-radius:20px;box-shadow:0 0 0 4px rgba(255,217,31,.1),0 10px 26px rgba(0,0,0,.42)}
.serve-btn{position:relative;overflow:hidden;border-radius:18px;padding:9px 12px;background:linear-gradient(180deg,#FFF3A6 0%,#FFD91F 55%,#F2B705 100%);box-shadow:0 5px 0 #b8901c,0 10px 22px rgba(0,0,0,.28);justify-content:flex-start;gap:10px;text-align:left}
.serve-btn .sv-ic{font-size:28px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.serve-btn .sv-t{flex:1;min-width:0;display:flex;flex-direction:column}
.serve-btn b{font-size:19px;font-weight:900;line-height:1.15}
.serve-btn small{font-size:12.5px;font-weight:800;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serve-btn .sv-go{font-size:15px;width:34px;height:34px;border-radius:50%;background:#3a2600;color:#FFD91F;display:grid;place-items:center;flex:none}
.serve-btn:after{content:"";position:absolute;top:0;left:0;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-160%) skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,62%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
.serve-btn.urgent{background:linear-gradient(180deg,#ffd0b0,#ff8a50 55%,#ec5b26);box-shadow:0 5px 0 #a8401a,0 0 24px rgba(255,110,60,.6);animation:urg .8s ease-in-out infinite}
.serve-btn.urgent .sv-go{background:#5a1a00;color:#ffd1b8}
@keyframes urg{0%,100%{transform:none}25%{transform:rotate(-.7deg) scale(1.01)}75%{transform:rotate(.7deg) scale(1.01)}}
.tabs{background:rgba(0,0,0,.26);padding:4px;border-radius:16px;gap:4px;border:1px solid rgba(255,255,255,.08)}
.tabs button{background:transparent;color:rgba(255,255,255,.82);transition:background .2s,color .2s;white-space:nowrap}
.tabs button.on{background:linear-gradient(180deg,#fff,#dff0fa);color:#0b3d5c;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.item{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.item .ic{width:50px;height:50px;border-radius:15px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.38),rgba(255,255,255,.06));display:grid;place-items:center;font-size:27px}
.item .buy{background:linear-gradient(180deg,#FFEC85,#FFD91F)}
.item.can{border-color:rgba(255,217,31,.8);box-shadow:0 0 0 1px rgba(255,217,31,.3),0 0 18px rgba(255,217,31,.2),0 3px 0 rgba(0,0,0,.18)}
.item.can .buy{animation:canBuy 1.6s ease-in-out infinite}
@keyframes canBuy{50%{transform:translateY(-2px)}}
.card{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.2));border:1px solid rgba(255,255,255,.07)}
.stats div{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05))}
.stats b{font-size:18px}
.setlist{display:flex;flex-direction:column;gap:12px}
.sheet{background:linear-gradient(180deg,#1c6189 0%,#0f3b57 42%,#0a2b40 100%);box-shadow:0 -12px 30px rgba(0,0,0,.45)}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:-4px auto 8px}
.sh-head .av{background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.25)}
.gmeta{display:flex;align-items:center;gap:6px;margin-top:4px}
.gmeta[hidden]{display:none}
.pips{display:flex;align-items:center;gap:3px;white-space:nowrap}
.pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.pips i.done{background:#3dd17a;box-shadow:0 0 6px rgba(61,209,122,.9)}
.pips i.cur{background:#FFD91F;animation:pip 1s ease-in-out infinite}
.pips em{font-style:normal;font-size:11px;font-weight:700;opacity:.85;margin-left:3px}
@keyframes pip{50%{transform:scale(1.35)}}
.moodbar{flex:1;min-width:28px;max-width:84px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.moodbar i{display:block;height:100%;width:100%;border-radius:3px;transition:width .5s ease-out,background .4s}
.mface{font-size:17px;line-height:1}
.qcard{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.18));border:1px solid rgba(255,255,255,.08)}
.sheet.swap .qcard,.sheet.swap .opts{animation:swapIn .32s ease-out}
@keyframes swapIn{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.opt{display:grid;grid-template-columns:28px 1fr;column-gap:10px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.opt .key{width:28px;height:28px;border-radius:9px;background:#e6f0f7;color:#0b3d5c;display:grid;place-items:center;font-weight:900;font-size:13px}
.opt .ot{display:flex;flex-direction:column;min-width:0}
.opt .py{display:block}
.opt.ok .key,.opt.no .key{background:rgba(255,255,255,.3);color:#fff}
.exnote{margin-top:8px;font-size:13px;font-weight:700;color:#ffd9d2}
.ov-card{background:radial-gradient(circle at 50% 0%,#2f7fab,#0f3a55 62%,#0a2b40);box-shadow:0 0 0 6px rgba(255,217,31,.14),0 20px 50px rgba(0,0,0,.55)}
.ov-card .btn{width:100%}
.ov-card .lead{font-size:15px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px}
.howto div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 4px;font-size:12px;font-weight:700;line-height:1.3}
.howto span{display:block;font-size:26px;margin-bottom:2px}
.howto.col{grid-template-columns:1fr;text-align:left}
.howto.col div{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;padding:8px 10px}
.howto.col span{font-size:22px;margin:0}
.linkbtn{display:block;margin:6px auto 0;background:none;border:0;color:rgba(255,255,255,.75);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.toast{white-space:normal;text-align:center;width:max-content;max-width:92%;line-height:1.3;border-radius:14px;background:linear-gradient(180deg,rgba(12,34,56,.94),rgba(5,18,32,.94));border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 16px rgba(0,0,0,.35)}
/* hướng dẫn người mới */
.coach{position:fixed;inset:0;z-index:90;pointer-events:none}
.coach[hidden]{display:none}
.coach-dim{position:absolute;inset:0;background:rgba(2,10,22,.7);pointer-events:auto}
.coach-ring{position:absolute;border-radius:16px;box-shadow:0 0 0 3px #FFD91F,0 0 22px 6px rgba(255,217,31,.55);pointer-events:none;animation:ring 1.3s ease-in-out infinite;transition:left .25s,top .25s,width .25s,height .25s}
@keyframes ring{50%{box-shadow:0 0 0 5px #FFD91F,0 0 30px 10px rgba(255,217,31,.35)}}
.coach-hand{position:absolute;font-size:32px;pointer-events:none;animation:hand .9s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
@keyframes hand{50%{transform:translateY(-10px)}}
.coach-tip{position:absolute;left:10px;right:10px;margin:0 auto;max-width:440px;background:linear-gradient(180deg,#fffef6,#fff2bf);color:#1d2430;border-radius:18px;padding:10px 14px 12px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 3px rgba(255,217,31,.85);font-size:14px;line-height:1.45}
.coach-tip.pop{animation:tipPop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tipPop{from{transform:scale(.85);opacity:0}}
.coach.nodim .coach-tip{box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 3px rgba(61,209,122,.95)}
.ct-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:#8a6a00;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.ct-top button{background:none;border:0;color:#6b7280;font-size:11.5px;text-decoration:underline;text-transform:none;letter-spacing:0;cursor:pointer;padding:4px 0 4px 8px}
.ct-txt b{color:#0b3d5c}
.ct-txt small{color:#4b5563;font-size:13px}
.coach-tip .btn{margin-top:10px;width:100%;padding:11px}
.coach-tip .btn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.serve-btn:after,.coach-hand,.coach-ring,.pips i.cur,.item.can .buy,.mini i,.pill.sat,.serve-btn.urgent,.coach-tip.pop,.sheet.swap .qcard,.sheet.swap .opts,.mini:after{animation:none!important}}
body.embed{overscroll-behavior-y:auto}
@media (prefers-reduced-motion:reduce){.pill.coin.bump,.serve-btn.pulse,.ov-card,.sheet,.wbub{animation:none!important}}
/* ===== v6 · game hợp nhất: sảnh 3D, sự kiện, nội thất, ôn tập ===== */
[lang^="zh"]{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
.go-row{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.go-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;border:0;font:inherit;color:#16171B;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s}
.go-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.go-btn .gi{font-size:26px;line-height:1}
.go-btn b{display:block;font-size:14.5px;line-height:1.2}
.go-btn small{display:block;font-size:11.5px;opacity:.78;font-weight:700}
#insideBtn{background:linear-gradient(180deg,#9ff0dc,#4fc9ae)}
#challengeBtn{background:linear-gradient(180deg,#ffd0b8,#ff8a5c)}
.evt-banner{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:14px;border:2px dashed #FFD91F;background:rgba(255,217,31,.14);color:#fff;font:inherit;font-size:13px;text-align:left;cursor:pointer;animation:evtPulse 1.6s ease-in-out infinite}
.evt-banner[hidden]{display:none}
.evt-banner .ic{font-size:22px}.evt-banner .t{flex:1;line-height:1.3}.evt-banner .go{font-weight:900;color:#FFD91F;white-space:nowrap}.evt-banner .x{padding:2px 6px;opacity:.75}
@keyframes evtPulse{50%{border-color:#fff3b0;background:rgba(255,217,31,.24)}}
.inside{position:fixed;inset:0;z-index:40;background:#cfeaf7;display:flex;flex-direction:column}
.inside[hidden]{display:none}
.in-frame{position:relative;flex:1;min-height:0}
.in-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.in-load{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:#2b2233;font-weight:800;font-size:14px;text-align:center}
.in-load[hidden]{display:none}
.in-top{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:2;display:flex;gap:6px;align-items:center;pointer-events:none}
.in-top>*{pointer-events:auto}
.in-top .back{background:#fff;color:#2b2233;border:2.5px solid #2b2233;border-radius:14px;padding:7px 11px;font:inherit;font-weight:900;font-size:13.5px;box-shadow:0 3px 0 #2b2233;cursor:pointer}
.in-zone{flex:1;min-width:0;background:#fff;color:#2b2233;border:2.5px solid #2b2233;border-radius:14px;padding:6px 9px;font-weight:900;font-size:12.5px;box-shadow:0 3px 0 #2b2233;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-coin{background:#FFD91F;color:#2b2233;border:2.5px solid #2b2233;border-radius:999px;padding:6px 10px;font-weight:900;font-size:13.5px;box-shadow:0 3px 0 #2b2233;white-space:nowrap}
.in-card{position:relative;z-index:2;margin:0 8px calc(8px + env(safe-area-inset-bottom));background:#fff;color:#2b2233;border:2.5px solid #2b2233;border-radius:18px;box-shadow:0 4px 0 #2b2233;padding:8px 10px}
.in-prog{height:7px;border-radius:9px;background:#f1e6d4;overflow:hidden;border:1.5px solid #2b2233;margin-bottom:7px}
.in-prog i{display:block;height:100%;background:linear-gradient(90deg,#7fd6c2,#2ec4b6);transition:width .5s}
.in-next{display:flex;align-items:center;gap:8px}
.in-next .ic{font-size:30px;line-height:1}
.in-next .t{flex:1;min-width:0;font-size:13px;line-height:1.3}
.in-next .t small{display:block;font-size:11px;opacity:.7;font-weight:700}
.in-next .t b{font-size:19px}.in-next .t i{color:#1E5AA8;font-style:normal;font-weight:700}
.in-next .t em{display:inline-block;font-style:normal;font-size:11px;background:#ffe9a8;border-radius:8px;padding:0 5px;margin-left:2px}
.in-next .buy{flex:none}
.in-hint{font-size:12px;margin-top:6px;opacity:.8}
.in-done{font-weight:900;font-size:14px;text-align:center;padding:6px}
.in-word{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:3;background:#fff;color:#2b2233;border:2.5px solid #2b2233;border-radius:16px;box-shadow:0 4px 0 #2b2233;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;animation:tipPop .3s cubic-bezier(.2,1.4,.4,1)}
.in-word[hidden]{display:none}
.in-word .ic{font-size:24px}.in-word b{font-size:22px}.in-word i{font-style:normal;color:#1E5AA8;font-weight:800}
.evt{position:fixed;inset:0;z-index:60;background:#0b3d5c;display:flex;flex-direction:column}
.evt[hidden]{display:none}
.evt-top{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:#16171B;color:#FFD91F;font-size:13.5px}
.evt-top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt-top button{background:none;border:0;color:#fff;font-size:18px;padding:2px 6px;cursor:pointer}
.evt iframe{flex:1;width:100%;border:0;background:#0b3d5c}
body.in-on,body.ev-on{overflow:hidden}
#toast{position:fixed;z-index:85;bottom:calc(18px + env(safe-area-inset-bottom))}
body.in-on #toast{bottom:calc(120px + env(safe-area-inset-bottom))}
.zone{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px;margin-bottom:8px}
.zone.lock{opacity:.6}
.zone-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.zone-h .zi{font-size:24px}.zone-h b{font-size:15px}.zone-h small{display:block;font-size:11.5px;opacity:.75}
.zone-h .zn{margin-left:auto;font-weight:900;color:#FFD91F;white-space:nowrap}
.zone .mini{height:7px;margin:0 0 8px}
.zrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px dashed rgba(255,255,255,.14)}
.zrow .ic{font-size:22px;width:28px;text-align:center}
.zrow .t{flex:1;min-width:0;line-height:1.25}
.zrow .t b{font-size:17px}.zrow .t i{font-style:normal;font-size:12px;color:#9fd8ff;margin-left:4px}.zrow .t span{display:block;font-size:12px;opacity:.85}
.zrow.got .t b{color:#7fffb0}
.zrow .buy{flex:none}
.zrow em{font-style:normal;font-size:10.5px;background:rgba(255,217,31,.2);color:#FFD91F;border-radius:8px;padding:0 5px;margin-left:4px}
.boss-list{display:flex;flex-direction:column;gap:6px;text-align:left}
.boss-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px}
.boss-row img{width:44px;height:58px;object-fit:cover;border-radius:8px;flex:none}
.boss-row .t{flex:1;min-width:0}.boss-row .t b{display:block;font-size:14px}.boss-row .t small{font-size:11.5px;opacity:.8}
.boss-row.lock{opacity:.55}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#ff3b3b;color:#fff;font-size:11px;line-height:18px;font-weight:900}
.tabs .badge[hidden]{display:none}
.learn-top{display:flex;justify-content:space-around;text-align:center}
.learn-top .lt-n b{display:block;font-size:22px;color:#FFD91F}.learn-top .lt-n small{font-size:11.5px;opacity:.8}
.card.center{text-align:center;font-weight:800}
.flip{perspective:900px;margin:4px auto 8px;max-width:330px;cursor:pointer}
.flip .in{position:relative;height:200px;transition:transform .45s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.back .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:linear-gradient(180deg,#fffef6,#fff1c4);color:#2b2233;border:2.5px solid #2b2233;box-shadow:0 4px 0 #2b2233;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}

/** đi chợ đêm Bãi Cháy: máy quay bay tới chợ, chủ sạp hỏi, chọn đúng tên món bằng tiếng Trung (2 lần thử) */

/** thử thách boss: 6 câu, trả lời đúng 4 câu trước khi hết 3 tim là thắng */
const BossQ = (() => {
  function pick(st) {
    const ok = q => q.type !== 'order' && typeof q.answer === 'number' && q.options && q.options.length >= 3;

  }
  function run(b, done) {
    const list = pick(b.st); let i = 0, hp = 4, lives = 3, fin = false;
    const end = win => { if (fin) return; fin = true; done(win); };
    const step = () => {
      const q = list[i % list.length], optZh = q.options.some(hasHan), prompt = !optZh && q.zh ? zs(esc(q.zh), esc(q.py), '') : q.type === 'fill' && q.py ? `<p class="bq-py">${esc(q.py)}</p>` : '';

        <p class="bq-n">Câu ${i + 1} · cần đúng thêm ${hp} câu</p><p>${esc(q.q)}</p>${prompt}
        <div class="mk-opts">${q.options.map((o, k) => `<button type="button" class="mk-o" data-k="${k}">${hasHan(o) ? `<b lang="zh-CN">${esc(o)}</b>${q.optionPy && q.optionPy[k] ? `<i>${esc(q.optionPy[k])}</i>` : ''}` : `<span>${esc(o)}</span>`}</button>`).join('')}</div><div id="bqFb" class="mk-fb" role="status"></div>`,
        'Bỏ cuộc', () => end(false));
      if (q.type === 'listen' && q.zh) speak(q.zh, true, { delay: 300 });
      document.querySelectorAll('.mk-o').forEach(btn => btn.onclick = () => {
        if (fin || btn.disabled) return; const k = +btn.dataset.k, good = k === q.answer;
        document.querySelectorAll('.mk-o').forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add('ok'); });
        if (good) { hp--; Snd.play('hit'); vib(25); const im = $('bqImg'); if (im) im.classList.add('hit'); } else { lives--; btn.classList.add('no'); Snd.play('hurt', .6); vib([40, 30, 40]); }
        $('bqFb').innerHTML = `${good ? '✓ Trúng đòn!' : '✗ Bị phản đòn.'} ${zw(esc(q.zh), esc(q.py), esc(q.vi))}`; if (q.zh) speak(q.zh, true);
        i++;
        setTimeout(() => { if (fin) return; if (hp <= 0 || lives <= 0 || i >= list.length * 2) { $('ov').classList.remove('on'); ovOpen = false; end(hp <= 0); } else step(); }, 1500);
      });
    };
    step();
  }
  return { run };
})();
/* ===== SỰ KIỆN: đi chợ · thử thách boss (bản cũ mở game.html trong khung; từ v8.1 chạy ngay trong game) ===== */

    } else if (r.ev === 'errand' && n) {
      if (r.ok) { const got = fare() * 2 + (r.tries <= 1 ? 10 : 0); S.coins += got; S.sat = Math.min(100, S.sat + 4); S.ev.needs = (S.ev.needs || 0) + 1; save(); Learn.add('n-' + n.id); renderHud();
        showOv('📦', 'Khách rất hài lòng!', `<p>${esc(n.who)} nhận được <b lang="zh-CN">${esc(n.zh)}</b> (${esc(n.py)} · ${esc(n.vi)}).</p><p>+${got} 🪙 · hài lòng +4%</p>`, 'Tiếp tục', null); }

    }

  const st = () => { if (!S.story || typeof S.story !== 'object') S.story = { done: {} }; if (!S.story.done) S.story.done = {}; return S.story; };
  const isDone = c => !!st().done[c.id];
  const unlocked = i => i <= 0 || isDone(STORY[i - 1]);
  const curIdx = () => STORY.findIndex(c => !isDone(c));
  let open = false, step = 0, ch = null, qs = [], qi = 0, score = 0;
  function nodes() { const cur = curIdx(); return STORY.map((c, i) => ({ id: c.id, n: i + 1, x: c.x, z: c.z, title: `${i + 1}. ${c.place}`, zh: `${c.zh} ${c.zpy}`, state: isDone(c) ? 'done' : i === cur ? 'cur' : 'lock' })); }
  function refresh() { const W = Scene.W; if (W) W.setStory(nodes(), curIdx(), id => openCh(id)); card(); cta(); }
  function partOf(i) { return PARTS[STORY[i].part]; }
  function card() {
    const el = $('jcard'); if (!el) return;
    const i = curIdx(), doneN = STORY.filter(isDone).length;
    if (i < 0) { el.innerHTML = `<div class="jc-top"><b>🗺️ Hành trình Hạ Long</b><span>${doneN}/${STORY.length} chương ✓</span></div><p class="jc-t">🏆 Bạn đã đi hết vịnh! Chạm vào ghim bất kỳ để ôn lại câu chuyện.</p><button type="button" class="btn" id="jcGo">🏨 Về khách sạn</button>`; $('jcGo').onclick = () => Scene.flyTo('street'); return; }
    const c = STORY[i], p = partOf(i);
    el.innerHTML = `<div class="jc-top"><b>${p.ico} Chặng ${c.part + 1} · ${p.lv} · ${esc(p.name)}</b><span>${doneN}/${STORY.length}</span></div>
      <div class="jc-dots">${STORY.map((x, k) => `<i class="${isDone(x) ? 'd' : k === i ? 'c' : ''}${k && STORY[k - 1].part !== x.part ? ' gap' : ''}"></i>`).join('')}</div>
      <p class="jc-t"><span class="jc-ico">${c.ico}</span><span><small>Chương ${i + 1}</small><b>${esc(c.title)}</b> · ${esc(c.place)} <span lang="zh-CN">${c.zh}</span> <i>${c.zpy}</i></span></p>
      <button type="button" class="btn${partFree(c.part) ? '' : ' dark'}" id="jcGo">${partFree(c.part) ? `▶ Vào chương ${i + 1}` : `🎫 Chặng ${c.part + 1} dùng thẻ tự học`}</button>
      <p class="jc-r">Xong chặng ${c.part + 1}: ${esc(p.reward)}</p>`;
    $('jcGo').onclick = () => openCh(c.id);
  }
  /** nút giữa thanh dưới: ngoài bản đồ / nhà nghỉ chưa mở → "Hành trình", còn lại → "Phục vụ" */
  function cta() {
    const b = $('serveBtn'); if (!b) return;
    const map = document.body.dataset.mode === 'bay' || !hotelOpen();
    b.classList.toggle('journey', map);
    b.querySelector('.sv-ic').textContent = map ? '🧭' : '🛎️';
    b.querySelector('b').textContent = map ? 'Hành trình' : 'Phục vụ';
    if (map) { const i = curIdx(); $('queueTxt').textContent = i < 0 ? 'đã đi hết vịnh' : `chương ${i + 1}: ${STORY[i].place}`; } else { lastQueueTxt = ''; queueUi(); }
  }
  function onMode(m) { const jc = $('jcard'); if (jc) jc.hidden = m !== 'bay' || open; cta(); if (m === 'bay') { card(); Tut.ev('map'); } }
  function next() { const i = curIdx(); if (Scene.mode !== 'bay') { Scene.flyTo('bay'); return; } if (i >= 0) openCh(STORY[i].id); }
  function openCh(id) {
    const i = STORY.findIndex(c => c.id === id), c = STORY[i]; if (!c) return;
    if (!unlocked(i)) { Snd.play('hurt', .5); toast(`🔒 Đi hết chương ${i} trước nhé`); return; }
    if (!partFree(c.part)) { Snd.unlock(); Snd.play('ui'); Gate.show('part', c.part); return; }
    Snd.unlock(); Snd.play('ui');
    const go = () => sheet(c);
    if (Scene.W) Scene.flyTo({ x: c.x, z: c.z + 8, S: 30, d: 1.1 }, go); else go();
  }
  /* ---------- bảng chương: Chuyện → Học từ → Thử thách → Xong ---------- */
  function sheet(c) {
    ch = c; open = true; step = 0; $('story').hidden = false; document.body.classList.add('st-on'); $('jcard').hidden = true; Scene.sheet = true; render();
  }
  function close(stay) { open = false; $('story').hidden = true; document.body.classList.remove('st-on'); Scene.sheet = false; Voice.stop(); if (Scene.mode === 'bay') $('jcard').hidden = false; else if (!stay) Scene.flyTo('bay'); }
  function head() { const i = STORY.indexOf(ch), p = PARTS[ch.part]; return `<div class="st-head"><span class="st-ico">${ch.ico}</span><div><small>Chương ${i + 1} · Chặng ${ch.part + 1} · ${p.lv}</small><b>${esc(ch.title)}</b><span>${esc(ch.place)} · <span lang="zh-CN">${ch.zh}</span> <i>${ch.zpy}</i></span></div><button type="button" class="st-x" id="stX" aria-label="Đóng">✕</button></div>
    <div class="st-steps">${['📖 Chuyện', '🀄 Học từ', '🎯 Thử thách'].map((t, k) => `<span class="${k === Math.min(step, 2) ? 'on' : k < step ? 'ok' : ''}">${t}</span>`).join('')}</div>`; }
  function render() {
    const el = $('storyCard'); let h = head();
    if (step === 0) {
      h += `<div class="st-body">${ch.story.map(p => `<p>${p}</p>`).join('')}${ch.tip ? `<div class="st-tip">🎵 ${ch.tip}</div>` : ''}
        <div class="st-line"><small>Câu của chương</small>${zs(ch.line[0], ch.line[1], ch.line[2])}<button type="button" class="spk" data-say="${esc(ch.line[0])}">🔊</button></div></div>
        <button type="button" class="btn" id="stNext">🀄 Học ${ch.words.length} từ của chương ▶</button>`;
    } else if (step === 1) {
      h += `<p class="st-hint">Chạm từng thẻ để nghe đọc. Thẻ đã học tự vào Sổ ôn tập (ôn ngắt quãng như Anki).</p><div class="st-words">${ch.words.map((w, k) => `<button type="button" class="st-w" data-w="${k}"><b lang="zh-CN">${w[0]}</b><i>${w[1]}</i><span>${esc(w[2])}</span><small><span lang="zh-CN">${w[3][0]}</span><br><i>${w[3][1]}</i><br>${esc(w[3][2])}</small></button>`).join('')}</div>
        <button type="button" class="btn" id="stNext">🎯 Thử thách 4 câu ▶</button>`;
    } else if (step === 2) {
      const q = qs[qi];
      h += `<div class="st-q"><small>Câu ${qi + 1}/${qs.length} · đúng ${score}</small><p>${q.p}</p>${q.zh ? `<div class="st-qzh"><b lang="zh-CN">${q.zh}</b>${q.py ? `<i>${q.py}</i>` : ''}</div>` : ''}${q.listen ? '<button type="button" class="btn ghost" id="stListen">🔊 Nghe lại</button>' : ''}
        <div class="st-opts">${q.o.map((o, k) => `<button type="button" class="st-o" data-o="${k}">${o.zh ? `<b lang="zh-CN">${o.zh}</b><i>${o.py}</i>` : ''}<span>${esc(o.vi)}</span></button>`).join('')}</div><div id="stFb"></div></div>`;
    } else {
      const pass = score >= 3, i = STORY.indexOf(ch);
      h += `<div class="st-end">${pass ? `<div class="big">🎉</div><b>Hoàn thành chương ${i + 1}!</b><p>Đúng ${score}/${qs.length} câu · 6 thẻ từ đã vào Sổ ôn tập.</p>${ch._reward ? `<p class="st-rw">${ch._reward}</p>` : ''}`
        : `<div class="big">💪</div><b>Đúng ${score}/${qs.length} câu</b><p>Cần 3/4 để qua chương. Đọc lại thẻ từ rồi thử lại nhé!</p>`}</div>
        ${pass ? `<button type="button" class="btn" id="stDone">${i + 1 < STORY.length && STORY[i + 1].part === ch.part ? `▶ Đi tiếp: chương ${i + 2}` : '✓ Xong'}</button>` : '<button type="button" class="btn" id="stRetry">🔁 Học lại từ</button>'}`;
    }
    el.innerHTML = h; el.scrollTop = 0;
    $('stX').onclick = () => { Snd.play('ui'); close(); };
    el.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say, true));
    if (step === 0) { $('stNext').onclick = () => { step = 1; Snd.play('ui'); render(); }; speak(ch.line[0], false, { delay: 500 }); }
    if (step === 1) { el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const w = ch.words[+b.dataset.w]; b.classList.add('seen'); speak(w[0] + '。' + w[3][0], true); }); $('stNext').onclick = () => { ch.words.forEach((w, k) => Learn.add(`s-${ch.id}-${k}`)); qs = quiz(ch); qi = 0; score = 0; step = 2; Snd.play('ui'); render(); }; }
    if (step === 2) bindQ();
    if (step === 3) { if ($('stDone')) $('stDone').onclick = () => { Snd.play('ui'); finish(); }; if ($('stRetry')) $('stRetry').onclick = () => { step = 1; render(); }; }
  }
  /** 4 câu tự sinh từ chương: nghĩa của từ · nghe chọn chữ · Việt → Trung · hiểu câu */
  function quiz(c) {
    const W = shuffle(c.words), pool = STORY.filter(x => x !== c), others = shuffle(pool.map(x => x.line)).slice(0, 3);
    const opts = (t, list, f) => shuffle([t, ...shuffle(list.filter(x => x !== t)).slice(0, 3)]).map(f);
    const a = W[0], b = W[1], d = W[2];
    return [
      { p: 'Từ này nghĩa là gì?', zh: a[0], py: a[1], o: opts(a, c.words, w => ({ vi: w[2], ok: w === a })), ans: a },
      { p: '🔊 Nghe và chọn chữ đúng', listen: b[0], o: opts(b, c.words, w => ({ zh: w[0], py: w[1], vi: '', ok: w === b })), ans: b },
      { p: `“${d[2]}” tiếng Trung là gì?`, o: opts(d, c.words, w => ({ zh: w[0], py: w[1], vi: '', ok: w === d })), ans: d },
      { p: 'Câu này nghĩa là gì?', zh: c.line[0], py: c.line[1], o: shuffle([c.line, ...others]).map(l => ({ vi: l[2], ok: l === c.line })), ans: [c.line[0], c.line[1], c.line[2]] }
    ];
  }
  function bindQ() {
    const q = qs[qi]; let done = false;
    if (q.listen) { speak(q.listen, true, { delay: 300 }); $('stListen').onclick = () => speak(q.listen, true); }
    document.querySelectorAll('.st-o').forEach(btn => btn.onclick = () => {
      if (done) return; done = true; const o = q.o[+btn.dataset.o];
      document.querySelectorAll('.st-o').forEach((x, k) => { x.disabled = true; if (q.o[k].ok) x.classList.add('ok'); });
      if (o.ok) { score++; Snd.coin(1); vib(20); } else { btn.classList.add('no'); Snd.play('hurt', .6); vib([40, 30, 40]); }
      const a = q.ans; $('stFb').innerHTML = `<div class="st-fb ${o.ok ? 'ok' : 'no'}">${o.ok ? '✓ Chính xác!' : '✗ Chưa đúng.'} ${zw(a[0], a[1], a[2])}</div><button type="button" class="btn" id="stQn">${qi + 1 < qs.length ? 'Câu tiếp ▶' : 'Xem kết quả ▶'}</button>`;
      speak(a[0], true);
      $('stQn').onclick = () => { Snd.play('ui'); if (qi + 1 < qs.length) { qi++; render(); } else { step = 3; if (score >= 3) reward(); render(); } };
    });
  }
  function reward() {
    const first = !isDone(ch); ch._reward = '';
    if (first) { S.coins += 25; S.pts += 10; ch._reward = '+25 🪙 · +10 điểm sao'; }
    st().done[ch.id] = 1; save(); renderHud(); renderBuild(); Snd.starUp(); confettiDom();
  }
  function confettiDom() { const r = rectOf($('storyCard')); if (r) burstAt(r.left + r.width / 2, r.top + 80, 34, 160); }
  function finish() {
    const i = STORY.indexOf(ch), c = ch; close(true);
    const partDone = STORY.filter(x => x.part === c.part).every(isDone), newLv = partDone ? Math.max(S.lv || 0, c.part + 1) : S.lv;
    const before = star();
    if (newLv > (S.lv || 0)) { S.lv = newLv; S.star = star(); save(); }
    refresh();
    const nextI = curIdx(), W = Scene.W;
    const after = () => {
      if (partDone && newLv === c.part + 1 && c._levelShown !== newLv) { c._levelShown = newLv; partUp(c.part, before); return; }
      if (nextI >= 0 && STORY[nextI].part === c.part) setTimeout(() => openCh(STORY[nextI].id), 300);
    };
    if (W && nextI >= 0 && nextI !== i) { Scene.flyTo({ x: (STORY[i].x + STORY[nextI].x) / 2, z: (STORY[i].z + STORY[nextI].z) / 2 + 8, S: 120, d: 1 }); W.walkHero(i, nextI, after); } else after();
  }
  function partUp(p, before) {
    const P = PARTS[p], after = star(); Snd.starUp(); vib([30, 40, 30, 40, 80]);
    if (p === 0) {
      showOv('🏨', 'Nhà nghỉ của bà mở cửa!', `<p>Xong <b>Chặng 1 · ${P.lv}</b>. Ā Bǎo mở lại nhà nghỉ ở Bãi Cháy: <b lang="zh-CN">欢迎！</b> <i>huānyíng</i> (chào mừng)!</p><p>Khách Trung Quốc bắt đầu xếp hàng ở cửa. Họ chỉ nói câu ngắn đúng trình độ của bạn: chào hỏi, số người, số ngày.</p><p class="note">Hành trình vẫn chờ bạn ở bản đồ: mỗi chặng xong, khách sạn mở thêm một hạng sao.</p>`, '🛎️ Ra đón khách', () => { Scene.flyTo('street', () => { if (S.tut !== 'done') Tut.start(); }); Scene.refill(); });
      Scene.rebuild(); Scene.refill(); return;
    }
    Scene.rebuild();
    showOv(P.ico, `Xong chặng ${p + 1} · ${P.lv}!`, `<p><b>${esc(P.reward)}</b>.</p>${after > before ? '' : Gate.partNote(p)}${p === 3 ? '<p>⚔️ Thử thách Boss HSK3, HSK4 sẽ đến như sự kiện khi khách sạn đạt 4★, 5★.</p>' : '<p>Khách mới sẽ nói câu dài hơn một chút. Cứ bình tĩnh: luôn có pinyin và nghĩa sau mỗi câu trả lời.</p>'}`,
      after > before ? 'Tuyệt!' : 'Về khách sạn ▶', () => { if (after > before) starUp(after); else Scene.flyTo('street'); });
    Gate.bindNote(after);
  }
  return { refresh, onMode, next, openCh, card, cta, close, get open() { return open; }, curIdx, isDone, _t: () => ({ qs, qi }) };
})();

    if (away > 0) { S.coins += away; save(); setTimeout(() => toast(`🧑‍💼 Nhân viên thu được +${away} 🪙 khi bạn vắng`), 1600); renderHud(); }
  }
  save();
}
init();
/* v8.1 · đường dẫn sâu: hotel/#the mở ô nhập mã thẻ (sau khi người mới chọn xong trình độ) · hotel/#market… bay tới khu đó */
(() => {
  const H = decodeURIComponent((location.hash || '').slice(1)); if (!H) return;
  let n = 0; const t = setInterval(() => {
    n++; const busy = ovOpen || document.querySelector('.onb:not([hidden])') || Journey.open || Tut.active;
    if (H === 'the') { if (S.lv != null && !busy) { clearInterval(t); Gate.code(); } }
    else { const W = Scene.W; if (W && W.places && !busy) { clearInterval(t); if (W.places.some(p => p.id === H)) W.goPlace(H); } }
    if (n > 240) clearInterval(t);
  }, 700);
})();

/* hook kiểm thử (không ảnh hưởng chơi) */
window.__hotel = {
  get S() { return S; }, get Q() { return Q; }, get queue() { return Scene.queue; }, ITEMS, QUESTIONS, star, fare, Scene, setHour, Journey, Onboard, STORY, guestLv, hotelOpen, gameHour, Voice, Tut, Snd,
  openServe, Gate, Mkt, BossQ, BOSSES, openBuy: id => openBuy(ITEM[id]), openFurnBuy: id => openFurnBuy(FURNI[id]), furnGot: id => furnGot(FURNI[id]), FURN, ZONES, Inside, Ev, Learn, nextFurn, furnLock, zonesDone,
  answer(correct) {
    if (!Q || Q.locked) return false;
    const q = Q.q;
    if (q.type === 'order') { const seq = correct ? q.answer : q.answer.slice().reverse(); seq.forEach(w => { const c = document.querySelector(`#orderChips .chip[data-w="${w}"]:not(.used)`); c && c.click(); }); return true; }
    const btn = [...document.querySelectorAll('#opts .opt')].find(b => correct ? +b.dataset.orig === q.answer : +b.dataset.orig !== q.answer);
    btn && btn.click(); return true;
  }
};
})();
</script>
<script>
/* gắn lang="zh-CN" cho mọi đoạn chữ Hán nằm lẫn trong câu tiếng Việt (chữ Việt giữ phông hệ thống, chữ Hán dùng phông Trung) */
(() => {
  const HAN = /[\u3400-\u9fff\uf900-\ufaff\u3000-\u303f\uff01-\uff5e]+/g, HAS = /[\u3400-\u9fff]/;
  const SKIP = { SCRIPT: 1, STYLE: 1, CANVAS: 1, TEXTAREA: 1, INPUT: 1, SVG: 1, svg: 1, TITLE: 1, IFRAME: 1, OPTION: 1, SELECT: 1 };
  const inZh = el => { for (let e = el; e && e.nodeType === 1; e = e.parentElement) { if (SKIP[e.nodeName]) return true; const l = e.getAttribute('lang'); if (l) return /^zh/i.test(l); } return false; };
  const fixText = t => {
    const v = t.nodeValue; if (!v || !HAS.test(v)) return;
    const par = t.parentElement; if (!par || inZh(par)) return;
    const f = document.createDocumentFragment(); let last = 0, m; HAN.lastIndex = 0;
    while ((m = HAN.exec(v))) { if (!HAS.test(m[0])) continue; if (m.index > last) f.appendChild(document.createTextNode(v.slice(last, m.index))); const sp = document.createElement('span'); sp.setAttribute('lang', 'zh-CN'); sp.textContent = m[0]; f.appendChild(sp); last = m.index + m[0].length; }
    if (!last) return; if (last < v.length) f.appendChild(document.createTextNode(v.slice(last))); par.replaceChild(f, t);
  };
  const scan = root => { if (root.nodeType === 3) { fixText(root); return; } if (root.nodeType !== 1 || SKIP[root.nodeName]) return; const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = []; for (let n = w.nextNode(); n; n = w.nextNode()) if (HAS.test(n.nodeValue)) list.push(n); list.forEach(fixText); };
  const go = () => { scan(document.body); new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') fixText(m.target); else m.addedNodes.forEach(scan); } }).observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.body) go(); else addEventListener('DOMContentLoaded', go);
})();
</script>
