<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ā Bǎo 消消乐 · Ghép 3 ôn từ · Khách sạn Vịnh Ā Bǎo</title>
<meta name="description" content="Ghép 3 viên cùng màu để dọn phòng khách sạn ở vịnh Hạ Long. Hết giờ thì trả lời 1 câu tiếng Trung để chơi tiếp. Xu kiếm được mang về game Khách sạn Vịnh Ā Bǎo.">
<meta name="theme-color" content="#2B1E5C">
<link rel="icon" href="icon-192.png">
<style>
@view-transition{navigation:auto}
:root{--ink:#1D1640;--navy:#2B1E5C;--gold:#FFD91F;--pink:#FF7FB6;--sky:#9AD0FF;--ok:#3DBE6A;--no:#EF4A43;--card:#fff;
  --UIF:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ZHF:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2B1E5C;color:#fff;font-family:var(--UIF);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[lang^="zh"]{font-family:var(--ZHF)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#3A2A78 0%,#7B4FA8 34%,#FF8FB1 68%,#FFC9A0 100%);z-index:0}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:
  radial-gradient(ellipse 60% 40% at 18% 100%,#4A3A8C 0 60%,transparent 61%),
  radial-gradient(ellipse 30% 55% at 72% 100%,#3E2F7C 0 60%,transparent 61%),
  radial-gradient(ellipse 22% 38% at 92% 100%,#4A3A8C 0 60%,transparent 61%),
  linear-gradient(180deg,transparent 0 55%,rgba(43,30,92,.55) 100%);opacity:.9}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen[hidden]{display:none}
/* ---------- màn bản đồ ---------- */
.mhead{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.seal{width:44px;height:44px;border-radius:12px;background:#C8102E;color:#FFE9A8;display:grid;place-items:center;font:900 26px/1 var(--ZHF);box-shadow:inset 0 0 0 3px #FFE9A8,0 3px 0 rgba(0,0,0,.25);transform:rotate(-4deg);view-transition-name:bk-seal;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font:900 20px/1.1 var(--UIF);letter-spacing:.2px}
.brand b span{font-family:var(--ZHF);color:var(--gold)}
.brand small{display:block;font-size:12px;color:#FFE3F0;margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:19px;flex:none}
.ibtn:active{transform:scale(.94)}
.wallet{display:flex;gap:6px;padding:0 12px 6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;font:800 12.5px/1.2 var(--UIF);white-space:nowrap}
.chip.gold{color:var(--gold)}
.tower{flex:1;overflow-y:auto;padding:4px 12px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tower::-webkit-scrollbar{display:none}
.floor{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 10px 12px;margin:0 0 10px}
.floor h3{margin:0 0 8px;font:900 14px/1.25 var(--UIF);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.floor h3 small{font-weight:700;color:#FFE3F0;font-size:12px}
.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.door{position:relative;aspect-ratio:3/4;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#FFF6E8,#F6D9B8);color:#5A3A1E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.2);font:900 13px/1 var(--UIF)}
.door i{font-style:normal;font-size:11px;letter-spacing:-1px;color:#E0A800}
.door i.e{color:rgba(90,58,30,.25)}
.door.cur{background:linear-gradient(180deg,#FFE97A,#FFB938);animation:pulse 1.2s ease-in-out infinite}
.door.cur::after{content:"▶";position:absolute;top:-8px;right:-6px;background:#C8102E;color:#fff;border-radius:999px;width:20px;height:20px;display:grid;place-items:center;font-size:10px}
.door.lock{background:rgba(255,255,255,.18);color:rgba(255,255,255,.6);box-shadow:none}
.door:active{transform:scale(.95)}
@keyframes pulse{50%{transform:translateY(-3px)}}
.floor .lockmsg{margin-top:8px;font:700 12px/1.35 var(--UIF);color:#FFE97A}
.floor .lockmsg a{color:#fff;font-weight:900}
.mfoot{display:flex;gap:8px;padding:8px 12px 12px}
.big{flex:1;border-radius:16px;padding:13px 12px;font:900 15px/1.2 var(--UIF);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #C99A00;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.big.alt{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #C99A00}
.note{font:600 12px/1.4 var(--UIF);color:#FFE3F0;padding:0 14px 6px}
/* ---------- màn chơi ---------- */
#play{align-items:center}
.hud{width:100%;max-width:520px;padding:6px 8px 4px;display:flex;flex-direction:column;gap:5px}
.hrow{display:flex;align-items:center;gap:6px}
.hrow .room{flex:1;min-width:0;font:900 14px/1.15 var(--UIF);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .room small{display:block;font-weight:700;font-size:11px;color:#FFE3F0}
.phao{font-size:15px;letter-spacing:-1px;white-space:nowrap}
.phao .x{filter:grayscale(1);opacity:.35}
.goals{display:flex;gap:5px;flex-wrap:wrap}
.goal{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border-radius:999px;padding:3px 9px 3px 4px;font:900 12.5px/1 var(--UIF)}
.goal img,.goal .gi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:15px}
.goal.done{background:rgba(61,190,106,.85)}
.goal.done::after{content:"✓"}
.bars{display:flex;gap:6px;align-items:center}
.tbar{position:relative;flex:1;height:18px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden}
.tbar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#3DD6FF,#7CF29A);border-radius:999px}
.tbar.low i{background:linear-gradient(90deg,#FF4D6D,#FFB938)}
.tbar b{position:absolute;inset:0;display:grid;place-items:center;font:900 11.5px/1 var(--UIF);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tbar.low{animation:low .5s ease-in-out infinite alternate}
@keyframes low{to{box-shadow:0 0 0 3px rgba(255,77,109,.55)}}
.score{min-width:92px;text-align:right;font:900 15px/1 var(--UIF);color:var(--gold)}
.sbar{position:relative;height:6px;border-radius:3px;background:rgba(0,0,0,.3);overflow:visible}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--gold);width:0;transition:width .3s}
.sbar u{position:absolute;top:-5px;font-size:11px;text-decoration:none;transform:translateX(-50%);filter:grayscale(1);opacity:.5}
.sbar u.on{filter:none;opacity:1}
.stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{display:block;touch-action:none;view-transition-name:bk-game}
.legend{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:2px 8px;max-width:520px}
.legend button{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.22);border-radius:999px;padding:2px 7px 2px 3px;font:700 11px/1.1 var(--UIF);color:#fff}
.legend img{width:18px;height:18px}
.legend b{font:900 13px/1 var(--ZHF)}
.boost{display:flex;gap:8px;padding:6px 10px 10px;width:100%;max-width:520px}
.boost button{flex:1;position:relative;border-radius:14px;background:rgba(255,255,255,.16);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 11px/1.15 var(--UIF);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.boost button .bi{font-size:22px;line-height:1}
.boost button small{font-size:10px;color:#FFE3F0}
.boost button .n{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#C8102E;display:grid;place-items:center;font:900 11px/1 var(--UIF);padding:0 5px}
.boost button[disabled]{opacity:.45}
.boost button.armed{background:var(--gold);color:var(--ink);animation:pulse .8s infinite}
.boost button.armed small{color:#5A3A1E}
.praise{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:5}
.praise .z{display:block;font:900 54px/1 var(--ZHF);color:#fff;-webkit-text-stroke:2px #C8102E;text-shadow:0 4px 0 #C8102E,0 8px 18px rgba(0,0,0,.4)}
.praise .p{display:block;margin-top:6px;font:900 15px/1.2 var(--UIF);color:var(--gold);text-shadow:0 2px 3px rgba(0,0,0,.6)}
.praise.go{animation:praise .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,14,48,.92);border:1.5px solid var(--gold);border-radius:14px;padding:8px 14px;font:800 13px/1.35 var(--UIF);opacity:0;transition:.25s;z-index:20;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- hộp thoại ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(18,10,40,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.box{width:100%;max-width:400px;max-height:calc(100dvh - 32px);overflow-y:auto;background:#FFF8EF;color:var(--ink);border-radius:22px;padding:16px;box-shadow:0 10px 0 rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box h2{margin:0 0 6px;font:900 19px/1.25 var(--UIF);text-align:center}
.box p{margin:6px 0;font:600 14px/1.45 var(--UIF)}
.box .sub{color:#6A5A8A;font-size:12.5px;text-align:center}
.box .row{display:flex;gap:8px;margin-top:12px}
.box .big{box-shadow:0 4px 0 #C99A00}
.box .big.alt{background:#EFE6FF;color:var(--ink);box-shadow:0 4px 0 #CDBDF0}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .why{flex:1;font:800 13px/1.35 var(--UIF);color:#6A3FB0}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 15px/1 var(--UIF)}
.qword{text-align:center;margin:10px 0 4px}
.qword .z{display:block;font:900 46px/1.15 var(--ZHF)}
.qword .p{display:block;font:800 17px/1.3 var(--UIF);color:#6A3FB0}
.qword .v{display:block;font:900 22px/1.3 var(--UIF)}
.qword .say{margin-top:6px;background:#EFE6FF;border-radius:999px;padding:6px 14px;font:800 13px/1 var(--UIF)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border-radius:14px;background:#fff;border:2px solid #E3D6FF;padding:10px 6px;min-height:58px;font:800 14.5px/1.25 var(--UIF);color:var(--ink);box-shadow:0 3px 0 #E3D6FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt b{font:900 22px/1.1 var(--ZHF)}
.opt i{font-style:normal;font-size:12px;color:#6A3FB0}
.opt.ok{background:#DFF7E6;border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.no{background:#FFE1E1;border-color:var(--no);box-shadow:0 3px 0 var(--no);animation:shake .3s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qfb{min-height:22px;text-align:center;font:800 14px/1.4 var(--UIF);margin-top:8px}
.qfb .zh{font-family:var(--ZHF)}
.stars{display:flex;justify-content:center;gap:6px;font-size:40px;margin:4px 0}
.stars span{filter:grayscale(1);opacity:.3;transform:scale(.6);transition:.35s cubic-bezier(.2,1.6,.4,1)}
.stars span.on{filter:none;opacity:1;transform:scale(1)}
.gain{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.gain .chip{background:#FFF0C2;color:#5A3A1E;border-color:#FFD91F}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.words button{background:#EFE6FF;border-radius:12px;padding:5px 9px;font:700 12px/1.25 var(--UIF);color:var(--ink);text-align:center}
.words button b{display:block;font:900 17px/1.1 var(--ZHF)}
.words button.bad{background:#FFE1E1}
.gl{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.gl div{display:flex;align-items:center;gap:8px;background:#F3ECFF;border-radius:12px;padding:6px 10px;font:800 14px/1.3 var(--UIF)}
.gl img,.gl .gi{width:28px;height:28px;display:grid;place-items:center;font-size:20px}
.tip{background:#FFF0C2;border-radius:12px;padding:8px 10px;font:700 13px/1.4 var(--UIF)}
.how{font:600 12.5px/1.45 var(--UIF);color:#5A4A7A}
.how b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.door.cur,.tbar.low,.boost button.armed{animation:none}}
/* v8.4 · hiệu ứng theo tầng: nền sống, đếm liên hoàn, băng rôn cắt ngang, chế độ 沸腾 fèiténg (sôi sục) */
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#cv{position:relative;z-index:1}
.combo{position:absolute;right:12px;top:4px;z-index:4;text-align:right;pointer-events:none;opacity:0;transition:opacity .25s}
.combo.on{opacity:1}
.combo b{display:block;font:900 34px/1 var(--UIF);color:#fff;-webkit-text-stroke:1.5px #9A63FF;text-shadow:0 3px 0 #5B2DBF}
.combo small{font:900 12px/1 var(--UIF);color:var(--gold)}
.combo.pop b{animation:cpop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes cpop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.cutin{position:fixed;left:0;right:0;top:36%;z-index:7;pointer-events:none;height:80px;display:flex;align-items:center;justify-content:center;gap:10px;transform:translateX(-120%) skewY(-6deg);background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.2) 18px 22px),linear-gradient(90deg,#ff3d7f,#9a63ff,#3df2ff);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.cutin.go{animation:cut 1.3s cubic-bezier(.2,.9,.2,1) forwards}
.cutin b{font:900 36px/1 var(--ZHF);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.cutin span{font:900 14.5px/1.25 var(--UIF);color:#fff;max-width:60%}
@keyframes cut{0%{transform:translateX(-120%) skewY(-6deg)}16%{transform:translateX(0) skewY(-6deg)}80%{transform:translateX(0) skewY(-6deg)}100%{transform:translateX(120%) skewY(-6deg)}}
.fever{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.3);overflow:hidden}
.fever i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#ff9f43,#ff3d7f,#ffd91f);transition:transform .25s}
.fever b{position:absolute;right:6px;top:0;font:900 9px/10px var(--UIF);color:#fff;letter-spacing:.3px;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.fever.on i{background:linear-gradient(90deg,#ff3d7f,#ffd91f,#3df2ff,#9a63ff,#ff3d7f);background-size:200% 100%;animation:fev 1s linear infinite}
@keyframes fev{to{background-position:200% 0}}
.tfly{position:fixed;z-index:8;pointer-events:none;font:900 16px/1 var(--UIF);color:#7CF29A;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.vipbtn{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,rgba(255,217,31,.28),rgba(255,111,176,.22));border:1px dashed rgba(255,217,31,.7);color:#fff;font:800 13.5px/1.35 var(--UIF);text-align:left;width:calc(100% - 24px)}
.vipbtn small{display:block;font-weight:700;font-size:11.5px;color:#FFE3F0}
.vipbtn i{font-style:normal;margin-left:auto;color:var(--gold);font-weight:900;white-space:nowrap}
.vipbtn.used{opacity:.6}
@media (prefers-reduced-motion:reduce){.cutin.go,.combo.pop b,.fever.on i{animation:none}}
/* điện thoại xoay ngang / màn thấp: 2 cột (bảng điều khiển trái, bàn chơi phải) để bàn không đè lên thanh giờ */
@media (orientation:landscape) and (max-height:560px){
  #play:not([hidden]){display:grid;grid-template-columns:minmax(230px,42%) 1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"hud stage" "legend stage" "boost stage";align-items:start;column-gap:6px}
  #play .hud{grid-area:hud;max-width:none;width:auto}
  #play .legend{grid-area:legend;justify-content:flex-start}
  #play .boost{grid-area:boost;max-width:none;width:auto;align-self:end}
  #play .stage{grid-area:stage;height:100%;min-height:0;align-self:stretch}
  .toast{bottom:calc(12px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<!-- BẢN ĐỒ: tháp khách sạn 4 tầng × 5 phòng -->
<section class="screen" id="map">
  <div class="mhead">
    <div class="seal" lang="zh-CN" aria-hidden="true">宝</div>
    <div class="brand"><b>Ā Bǎo <span lang="zh-CN">消消乐</span></b><small><span lang="zh-CN">xiāoxiāolè</span> · ghép 3 ôn từ · dọn phòng khách sạn</small></div>
    <button type="button" class="ibtn" id="muteM" aria-label="Tắt/bật âm thanh">🔊</button>
  </div>
  <div class="wallet" id="wallet"></div>
  <p class="note" id="mapNote"></p>
  <button type="button" class="vipbtn" id="vipBtn"></button>
  <div class="tower" id="tower"></div>
  <div class="mfoot"><a class="big alt" id="homeBtn" href="./">🏨 Về khách sạn</a><button type="button" class="big" id="goBtn">▶ Chơi tiếp</button></div>
</section>

<!-- CHƠI -->
<section class="screen" id="play" hidden>
  <div class="hud">
    <div class="hrow">
      <button type="button" class="ibtn" id="backBtn" aria-label="Về bản đồ">◀</button>
      <div class="room" id="roomName"></div>
      <span class="phao" id="phao" title="Phao cứu sinh 救生圈 jiùshēngquān"></span>
      <button type="button" class="ibtn" id="muteP" aria-label="Tắt/bật âm thanh">🔊</button>
    </div>
    <div class="goals" id="goals"></div>
    <div class="bars"><div class="tbar" id="tbar"><i id="tfill"></i><b id="ttxt"></b></div><div class="score" id="score">0</div></div>
    <div class="sbar" id="sbar"><i id="sfill"></i></div>
    <div class="fever" id="fever" title="沸腾 fèiténg · sôi sục: đầy thanh thì 8 giây điểm ×2, đồng hồ đứng"><i id="ffill"></i><b><span lang="zh-CN">沸腾</span> fèiténg</b></div>
  </div>
  <div class="stage" id="stage"><canvas id="amb" aria-hidden="true"></canvas><div class="combo" id="combo" aria-hidden="true"></div><canvas id="cv" aria-label="Bàn ghép 3: kéo 1 viên sang ô bên cạnh"></canvas><div class="praise" id="praise" aria-live="polite"></div></div>
  <div class="legend" id="legend"></div>
  <div class="boost">

const HOTEL_KEY = 'bk_hotel_v3', SAVE_KEY = 'bk_xiao_v1', INBOX_KEY = 'bk_xiao_inbox', WORDS_KEY = 'bk_words_v1';
/* 6 màu ngọc: mỗi màu một chữ Hán (hình riêng để người khó phân biệt màu vẫn chơi được) */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** nhiệm vụ suối nóng mỗi ngày (cùng dữ liệu với mini.js · Khu trò chơi) */

/* ===== CẦU NỐI GAME KHÁCH SẠN =====
   Trong khung (mở từ game Khách sạn): gửi từng kết quả qua postMessage, game Khách sạn cộng xu và ghi Sổ ôn ngay.

};
addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.type !== 'bk-xiao-state') return; HS = Object.assign(HS || {}, e.data.hs || {}); renderWallet(); });

/* ===== TỪ VỰNG & CÂU HỎI (ưu tiên thẻ đến hạn trong Sổ ôn của game Khách sạn) ===== */
const Words = (() => {
  let CAT = [];
  function load() {
    const ex = Store.get(WORDS_KEY, null);
    const src = ex && Array.isArray(ex.cards) && ex.cards.length >= 20 ? ex.cards : (window.XIAO_WORDS || []);
    const seen = new Set(); CAT = [];
    // nghĩa viết thường chữ đầu cho đồng đều ("Du thuyền" → "du thuyền"), giữ tên riêng ("Vịnh Hạ Long")
    const viNorm = v => { const w = String(v).split(' '); return w.length > 1 && /^\p{Lu}/u.test(w[1]) ? v : v.charAt(0).toLowerCase() + v.slice(1); };
    src.forEach(w => { if (!w || !w[0] || !w[1] || !w[3] || seen.has(w[0])) return; seen.add(w[0]); CAT.push({ id: w[0], zh: w[1], py: w[2] || '', vi: viNorm(w[3]), lv: +w[4] || 0 }); });
  }
  load();
  const byId = id => CAT.find(c => c.id === id);
  function dueIds() { const cs = (HS && HS.cards) || {}, now = Date.now(); return Object.keys(cs).filter(id => cs[id] && cs[id].due <= now && byId(id)).sort((a, b) => cs[a].due - cs[b].due); }
  function seenIds() { return Object.keys((HS && HS.cards) || {}).filter(byId); }
  let asked = [], wrong = [];
  function reset() { asked = []; wrong = []; }
  /** chọn từ: (1) từ vừa sai trong phòng này, sau 2 câu khác (2) thẻ đến hạn (3) thẻ đã học (4) từ mới đúng mức tầng */
  function pick(hsk) {
    const pool = CAT.filter(c => c.lv <= hsk), fresh = c => c && !asked.slice(-6).includes(c.id);
    const w = wrong.find(x => asked.length - x.at >= 2 && fresh(byId(x.id)));
    if (w) { wrong = wrong.filter(x => x !== w); return byId(w.id); }
    const due = dueIds().map(byId).filter(c => c && c.lv <= hsk + 1 && fresh(c));
    if (due.length && Math.random() < .6) return due[0];
    const seen = seenIds().map(byId).filter(c => c && c.lv <= hsk + 1 && fresh(c));
    if (seen.length && Math.random() < .35) return seen[(Math.random() * seen.length) | 0];
    let lvl = pool.filter(c => c.lv >= Math.max(0, hsk - 1) && fresh(c)); if (!lvl.length) lvl = pool.filter(fresh); if (!lvl.length) lvl = CAT.filter(fresh); if (!lvl.length) lvl = CAT;
    return lvl[(Math.random() * lvl.length) | 0];
  }
  function make(hsk) {
    const c = pick(hsk); asked.push(c.id);
    const fmt = hsk >= 1 && Math.random() < (hsk >= 2 ? .4 : .3) ? 'vi2zh' : 'zh2vi';
    const pool = CAT.filter(x => x.id !== c.id && x.vi !== c.vi && x.zh !== c.zh);
    const near = shuffle(pool.filter(x => Math.abs(x.lv - c.lv) <= 1)), far = shuffle(pool);
    const others = []; for (const x of near.concat(far)) { if (others.length >= 3) break; if (!others.some(o => o.vi === x.vi || o.zh === x.zh)) others.push(x); }
    const opts = shuffle([c, ...others]);
    return { c, fmt, opts, answer: opts.indexOf(c) };
  }
  function result(c, ok) { if (!ok) wrong.push({ id: c.id, at: asked.length }); }
  return { load, make, result, reset, dueIds, get size() { return CAT.length; } };
})();

/* ===== ÂM THANH (tự tổng hợp, không tải tệp) · bộ nhạc cụ chung bk-audio.js =====
   v8.5: hết sóng vuông/răng cưa; ghép viên = gảy đàn tranh theo ngũ cung (dây chuyền càng dài nốt càng cao) + chuông nhỏ;

   Trước v8.5 hai hàm cùng tên "unlock" đè nhau nên mỗi lần chạm bàn đều kêu "bíp" sóng vuông – đã tách: wake() mở âm thanh, unlock() tiếng mở khoá. */
const Sfx = (() => {
  let ac = null, E = null, M = null, ducked = false;
  const NOTES = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96];   // thang ngũ cung C D E G A: dây chuyền càng dài nốt càng cao
  function ctx() {
    if (SV.mute || !window.BKAudio) return null;
    if (!ac) {
      try {
        const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
        ac = new A(); const m = ac.createGain(); m.gain.value = .9; m.connect(ac.destination);
        E = BKAudio.engine(ac, m); M = E.music({ vol: .26, ids: ['chieu', 'tra', 'song'] });
      } catch (e) { ac = null; E = null; return null; }
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  const go = f => { if (ctx()) try { f(E, ac.currentTime + .005, E.sfx); } catch (e) {} };
  function boom() { go((E, t, o) => { E.thump(o, t, .22, 120, 38, .5); E.whoosh(o, t, .42, .09, 1000, 130, .7); }); }
  function pearl() { go((E, t, o) => { E.gliss(o, [76, 79, 81, 84, 86, 88, 91, 93], t, .07, .045, .9); [96, 100].forEach((m, k) => E.chime(o, m, t + .38 + k * .1, .035, 1.4)); }); }
  return {
    get musicOn() { return !!(M && M.on); }, get state() { return ac ? ac.state : 'none'; },
    wake() { if (ctx() && !M.on && !(HS && HS.music === false)) { M.start(); if (ducked) M.duck(true); } },   // tắt nhạc nền trong game Khách sạn thì ở đây cũng không phát nhạc
    mute(m) { if (m) { if (M) M.stop(); } else this.wake(); },
    duck(d) { ducked = d; if (M) M.duck(d); },
    pause(p) { if (!ac) return; try { const pr = p ? ac.suspend() : SV.mute ? null : ac.resume(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {} },
    swap() { go((E, t, o) => E.blip(o, 660, 990, t, .08, .045)); },
    bad() { go((E, t, o) => E.bau(o, 62, t, .3, .07, { from: 65, uon: false })); },
    match(chain, big) { go((E, t, o) => { const m = NOTES[Math.min(NOTES.length - 1, chain - 1 + (big ? 1 : 0))]; E.tranh(o, m, t, .1, .45); E.chime(o, m + 12, t + .015, .03, .6); }); },
    made() { go((E, t, o) => [79, 84, 88, 91].forEach((m, k) => E.chime(o, m, t + k * .04, .04, .8))); },
    beam() { go((E, t, o) => { E.whoosh(o, t, .34, .09, 500, 3800, 1.4); E.chime(o, 91, t + .05, .035, .5); }); },
    boom, pearl,
    nova() { boom(); pearl(); go((E, t, o) => E.thump(o, t, .2, 70, 30, .8)); },
    sand() { go((E, t, o) => E.whoosh(o, t, .14, .045, 2200, 1100, 1)); },
    crate() { go((E, t, o) => { E.mo(o, t, .09, 480); E.mo(o, t + .05, .05, 620); }); },
    unlock() { go((E, t, o) => { E.chime(o, 88, t, .05, .5); E.chime(o, 93, t + .06, .05, .7); }); },
    lug() { go((E, t, o) => [79, 84, 88].forEach((m, k) => E.tranh(o, m, t + k * .12, .09, .6))); },
    tick(n) { go((E, t, o) => E.mo(o, t, n <= 3 ? .09 : .065, n <= 3 ? 1500 : 1100)); },
    timeup() { go((E, t, o) => [76, 72, 69].forEach((m, k) => E.bau(o, m, t + k * .17, .22, .08, { uon: false }))); },
    ok() { go((E, t, o) => { E.tranh(o, 81, t, .1, .5); E.tranh(o, 88, t + .09, .1, .6); E.chime(o, 93, t + .18, .035, 1); }); },
    no() { go((E, t, o) => E.bau(o, 57, t, .45, .09, { from: 60, uon: false })); },
    coin() { go((E, t, o) => { E.chime(o, 91, t, .05, .5); E.chime(o, 96, t + .07, .045, .8); }); },
    win() { go((E, t, o) => { [72, 76, 79, 84, 79, 84, 88].forEach((m, k) => E.tranh(o, m, t + k * .12, .09, k > 4 ? 1.2 : .5)); E.chime(o, 96, t + .85, .04, 1.8); }); },
    lose() { go((E, t, o) => [72, 69, 67, 64].forEach((m, k) => E.tieu(o, m, t + k * .22, .26, .09))); },
    ui() { go((E, t, o) => E.mo(o, t, .04, 1500)); },
    fever() { go((E, t, o) => { E.gliss(o, [72, 74, 76, 79, 81, 84, 86, 88, 91], t, .08, .05, 1); E.whoosh(o, t, .6, .05, 400, 5000, 1.2); [96, 100].forEach((m, k) => E.chime(o, m, t + .5 + k * .1, .04, 1.4)); }); },
    cut() { go((E, t, o) => { E.whoosh(o, t, .35, .07, 300, 4200, 1.1); E.mo(o, t + .02, .06, 900); E.mo(o, t + .1, .06, 1300); }); },
  };
})();
/* giọng đọc tiếng Trung có sẵn trên máy (không gọi máy chủ ngoài) */
const Voice = (() => {
  const ss = window.speechSynthesis; let v = null;
  function pickV() { if (!ss) return; const vs = ss.getVoices() || []; v = vs.find(x => /zh[-_]CN/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang)) || null; }
  if (ss) { pickV(); try { ss.addEventListener('voiceschanged', pickV); } catch (e) {} }
  return {

/* ===== VẼ ===== */
const cv = $('cv'), g2 = cv.getContext('2d');
let DPR = 1, CELL = 40, BW = 0, BH = 0, SPR = {}, G = null, tier = 1;
const PMUL = [1, 1, 1.25, 1.55, 1.9];   // tầng càng cao hạt càng nhiều
const CSSV = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim(), ZHF = CSSV('--ZHF'), UIF = CSSV('--UIF');
function shapePath(c, sh, r) {
  c.beginPath();
  if (sh === 'ci') c.arc(0, 0, r, 0, Math.PI * 2);
  else if (sh === 'sq') { const k = r * .92, q = r * .38; c.moveTo(-k + q, -k); c.arcTo(k, -k, k, k, q); c.arcTo(k, k, -k, k, q); c.arcTo(-k, k, -k, -k, q); c.arcTo(-k, -k, k, -k, q); }
  else if (sh === 'hx') { for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; c.lineTo(Math.cos(a) * r * 1.02, Math.sin(a) * r * 1.02); } }
  else if (sh === 'dr') { c.moveTo(0, -r * 1.05); c.bezierCurveTo(r * .55, -r * .45, r * .95, r * .05, r * .9, r * .35); c.arc(0, r * .3, r * .9, 0.05, Math.PI - 0.05); c.bezierCurveTo(-r * .95, r * .05, -r * .55, -r * .45, 0, -r * 1.05); }
  else if (sh === 'st') { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .55 : r * 1.06; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr + r * .06); } }
  else if (sh === 'sh') { c.moveTo(0, r * .95); c.bezierCurveTo(-r * .4, r * .7, -r * 1.05, r * .2, -r * .95, -r * .2); c.arc(0, -r * .1, r * .96, Math.PI + .1, -.1); c.bezierCurveTo(r * 1.05, r * .2, r * .4, r * .7, 0, r * .95); }
  c.closePath();
}
function tileSprite(col, kind) {
  const s = Math.round(CELL * DPR), cnv = document.createElement('canvas'); cnv.width = cnv.height = s;

      ? `<div class="qword"><span class="z" lang="zh-CN">${esc(c.zh)}</span><span class="p">${esc(c.py)}</span><span class="sub">nghĩa là gì?</span>${Voice.ok ? '<button type="button" class="say" id="qSay">🔊 Nghe đọc</button>' : ''}</div>`
      : `<div class="qword"><span class="v">${esc(c.vi)}</span><span class="sub">tiếng Trung là chữ nào?</span></div>`;
    const opt = (o, k) => q.fmt === 'zh2vi' ? `<button type="button" class="opt" data-k="${k}">${esc(o.vi)}</button>` : `<button type="button" class="opt" data-k="${k}"><b lang="zh-CN">${esc(o.zh)}</b><i>${esc(o.py)}</i></button>`;
    modal(`<div class="qhead"><div class="why">${why}</div><div class="ring"><svg width="46" height="46"><circle cx="23" cy="23" r="19" stroke="#EFE6FF" stroke-width="6" fill="none"/><circle id="qRing" cx="23" cy="23" r="19" stroke="#9A63FF" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0"/></svg><b id="qLeft">${ASK_SEC}</b></div></div>
      ${head}<div class="opts">${q.opts.map(opt).join('')}</div><div class="qfb" id="qFb" role="status"></div>`, true);
    if (q.fmt === 'zh2vi') setTimeout(() => Voice.say(c.zh), 200);
    const sb = $('qSay'); if (sb) sb.onclick = () => Voice.say(c.zh);
    const iv = setInterval(() => { if (fin) return; if (document.hidden) return; left = Math.max(0, ASK_SEC - (performance.now() - t0) / 1000 * SPEED); const rg = $('qRing'), lb = $('qLeft'); if (rg) rg.setAttribute('stroke-dashoffset', String(119.4 * (1 - left / ASK_SEC))); if (lb) lb.textContent = Math.ceil(left); if (left <= 0) answer(-1); }, 100);
    function answer(k) {
      if (fin) return; fin = true; clearInterval(iv);
      const ok = k === q.answer, fast = ok && (performance.now() - t0) / 1000 * SPEED <= FAST_SEC;
      document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (+b.dataset.k === q.answer) b.classList.add('ok'); else if (+b.dataset.k === k) b.classList.add('no'); });
      $('qFb').innerHTML = (ok ? (fast ? '⚡ Nhanh quá! ' : '✓ Đúng rồi! ') : k < 0 ? '⏰ Hết 10 giây. ' : '✗ Chưa đúng. ') + `<span class="zh" lang="zh-CN">${esc(c.zh)}</span> ${esc(c.py)} · ${esc(c.vi)}`;
      if (ok) { Sfx.ok(); vib(20); } else { Sfx.no(); vib([40, 30, 40]); }
      Voice.say(c.zh);
      Words.result(c, ok); Bridge.learn(c.id, ok); if (ok) arcadeBump('ok');
      askedWords.push({ c, ok });
      setTimeout(() => { closeModal(); done({ ok, fast, c }); }, (ok ? 1100 : 1900) / SPEED);

}
const hskOf = () => Math.max(0, Math.ceil(L.id / 5) - 1);
async function timeUp() {
  if (state !== 'play' || busy || paused) return;
  if (G.won()) return win();
  paused = true; Sfx.timeup(); vib([60, 40, 60]);
  if (phao <= 0 || rescues >= RESCUE_MAX) return lose();
  while (phao > 0 && rescues < RESCUE_MAX) {
    const r = await ask(`<span lang="zh-CN">时间到!</span> shíjiān dào · Hết giờ! Trả lời đúng để được <b>+${RESCUE_SEC} giây</b>`, hskOf());
    if (r.ok) { rescues++; const s = RESCUE_SEC + (r.fast ? FAST_BONUS : 0); timeLeft = 0; addTime(s, r.fast ? 'trả lời nhanh' : 'trả lời đúng'); paused = false; idleAt = performance.now(); renderHud(); return; }
    phao--; renderHud(); toast(`🛟 Mất 1 phao · còn ${phao}`, 1400); vib(40);
    if (phao <= 0) break;
  }
  lose();
}
const Boost = {
  cool: 0,
  async tap(b) {
    if (state !== 'play' || paused || busy || !(SV.boost[b] > 0) || this.cool > performance.now()) return;
    if (armed === b) { armed = null; renderHud(); return; }
    Sfx.ui(); paused = true;
    const name = { bomb: ['💣 Bom', '炸弹', 'zhàdàn'], hammer: ['🔨 Búa', '锤子', 'chuízi'], mix: ['🔀 Xáo bàn', '洗牌', 'xǐpái'] }[b];
    const r = await ask(`${name[0]} <span lang="zh-CN">${name[1]}</span> ${name[2]} · trả lời đúng để dùng`, hskOf());
    paused = false; idleAt = performance.now();
    if (!r.ok) { this.cool = performance.now() + 5000 / SPEED; renderHud(); toast('Ôn lại từ này nhé · 5 giây nữa thử lại', 1600); setTimeout(renderHud, 5100 / SPEED); return; }
    if (b === 'mix') { SV.boost.mix--; save(); busy = true; G.shuffle(); reposition(); Sfx.pearl(); await until(settled); busy = false; renderHud(); return; }
    armed = b; renderHud(); toast(b === 'bomb' ? 'Chạm 1 ô để đặt bom (nổ 3×3)' : 'Chạm 1 ô để đập (cả thùng và khoá)', 1800);
  },
};
async function useArmed(p) {
  const b = armed; armed = null; SV.boost[b]--; save(); renderHud();
  const s = b === 'bomb' ? G.bombSeed(p[0], p[1]) : G.hammerSeed(p[0], p[1]);
  G.chain = 0; vib(b === 'bomb' ? 50 : 25);
  await cascade({ seed: s.seed, fx: s.fx });
}
$('bBomb').onclick = () => Boost.tap('bomb'); $('bHammer').onclick = () => Boost.tap('hammer'); $('bMix').onclick = () => Boost.tap('mix');

/* ===== THẮNG / THUA ===== */
async function win() {
  if (state !== 'play') return; state = 'end'; paused = true; busy = true;
  praise(P_WIN); Sfx.win(); vib([30, 50, 30, 50, 80]); flash(.4);
  // Pháo hoa vịnh: mỗi giây còn lại thành 1 phát pháo hoa và +50 điểm
  const left = Math.min(20, Math.ceil(timeLeft));
  for (let i = 0; i < left; i++) { const r = Math.floor(Math.random() * G.R), q = Math.floor(Math.random() * G.C); burst(r, q, Math.floor(Math.random() * 6), 18); fxs.push({ type: 'boom', r, c: q, rad: .5, col: 3, t: 0, d: .45 }); G.score += 50; timeLeft = Math.max(0, timeLeft - 1); renderTime(); renderHud(); if (i % 2 === 0) Sfx.coin(); await wait(110); }
  await wait(500);
  const stars = G.stars(), prev = L.vip ? { stars: 9, score: 0 } : SV.best[L.id] || { stars: 0, score: 0 }, first = !prev.stars, vipFirst = L.vip && SV.vipDay !== dayKey();
  let coins = 10 + stars * 5 + Math.min(20, Math.floor(G.score / 1500)) + (first ? 20 : 0), pts = (first ? 5 : 0) + (stars === 3 && prev.stars < 3 ? 5 : 0);
  if (vipFirst) { coins *= 2; pts += 3; SV.vipDay = dayKey(); }
  arcadeBump('xiao');
  const gifts = vipFirst ? ['👑 VIP ×2'] : [];
  if (stars === 3 && prev.stars < 3) { SV.boost.bomb = Math.min(BOOST_MAX, (SV.boost.bomb || 0) + 1); gifts.push('💣 +1'); }
  if (first && L.id % 5 === 0) { ['bomb', 'hammer', 'mix'].forEach(k => { SV.boost[k] = Math.min(BOOST_MAX, (SV.boost[k] || 0) + 1); }); gifts.push('Xong cả tầng: 💣🔨🔀 +1'); }
  if (!L.vip) SV.best[L.id] = { stars: Math.max(stars, prev.stars), score: Math.max(G.score, prev.score) }; SV.plays++; save();
  Bridge.reward(coins, pts, L.vip ? 'vip' : L.id, stars);
  const next = L.vip ? null : LEVELS.find(x => x.id === L.id + 1), canNext = next && roomOpen(next.id);
  modal(`<h2>${esc(L.name)} sạch bong! <span lang="zh-CN">干净了!</span></h2><p class="sub">gānjìng le · sạch rồi</p>
    <div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p class="sub">${G.score.toLocaleString('vi')} điểm</p>
    <div class="gain"><span class="chip">🪙 +${coins} gửi về khách sạn</span>${pts ? `<span class="chip">✨ +${pts} điểm sao khách sạn</span>` : ''}${gifts.map(g => `<span class="chip">${g}</span>`).join('')}</div>
    ${wordsHtml()}
    <div class="row"><button type="button" class="big alt" id="toHotel">${FROM_ARC ? '♨️ Khu trò chơi' : `🏨 ${IN_FRAME ? 'Về khách sạn' : 'Mang xu về khách sạn'}`}</button>${canNext ? `<button type="button" class="big" id="toNext">${esc(next.name)} ▶</button>` : `<button type="button" class="big" id="toMap">Bản đồ ▶</button>`}</div>`);
  $('stars').querySelectorAll('span').forEach((s, i) => setTimeout(() => { if (i < stars) { s.classList.add('on'); Sfx.coin(); } }, 250 + i * 320));
  bindWords();
  $('toHotel').onclick = () => { Sfx.ui(); Bridge.close(); };
  if (canNext) $('toNext').onclick = () => { closeModal(); startLevel(next.id); }; else $('toMap').onclick = () => { closeModal(); showMap(); };
  busy = false;
}
function lose() {
  state = 'end'; paused = true; Sfx.lose();
  const gs = G.goals().filter(g => !g.done);
  modal(`<h2>Chưa dọn xong ${esc(L.name)}</h2><p class="sub">${phao <= 0 ? 'Hết phao cứu sinh 🛟' : 'Hết lượt cứu giờ'} · còn ${gs.map(g => g.k === 'col' ? `${g.need - g.have} viên ${TILE[g.c].vi}` : g.k === 'score' ? `${(g.need - g.have).toLocaleString('vi')} điểm` : `${g.need - g.have} ${GOAL_NAME[g.k][2].replace(/^\S+ /, '')}`).join(', ')}</p>
    ${wordsHtml()}<p class="sub">Từ trả lời sai đã vào Sổ ôn của khách sạn. Ôn xong chơi lại dễ hơn!</p>
    <div class="row"><button type="button" class="big alt" id="toMap">Bản đồ</button><button type="button" class="big" id="again">Chơi lại ↻</button></div>`);
  bindWords();
  $('toMap').onclick = () => { closeModal(); showMap(); }; $('again').onclick = () => { closeModal(); startLevel(L.id, { vip: L.vip }); };
}
function wordsHtml() { if (!askedWords.length) return ''; const seen = new Set(), ws = askedWords.filter(w => !seen.has(w.c.id) && seen.add(w.c.id)); return `<p class="sub" style="margin-top:10px">Từ vừa ôn (chạm để nghe)</p><div class="words">${ws.map((w, i) => `<button type="button" class="${w.ok ? '' : 'bad'}" data-w="${i}"><b lang="zh-CN">${esc(w.c.zh)}</b>${esc(w.c.py)} · ${esc(w.c.vi)}</button>`).join('')}</div>`; }
function bindWords() { const seen = new Set(), ws = askedWords.filter(w => !seen.has(w.c.id) && seen.add(w.c.id)); document.querySelectorAll('.words [data-w]').forEach(b => b.onclick = () => Voice.say(ws[+b.dataset.w].c.zh)); }

/* ===== HỘP THOẠI ===== */
function modal(html, keep) { $('modBox').innerHTML = html; $('mod').hidden = false; $('mod').dataset.keep = keep ? '1' : ''; }
function closeModal() { $('mod').hidden = true; $('modBox').innerHTML = ''; Sfx.duck(false); }
$('backBtn').onclick = () => {
  if (state !== 'play' || busy) { if (state === 'end') showMap(); return; }
  const was = paused; paused = true; Sfx.ui();
  modal(`<h2>Rời ${esc(L.name)}?</h2><p class="sub">Phòng đang dọn dở sẽ phải dọn lại từ đầu.</p><div class="row"><button type="button" class="big alt" id="leave">Rời phòng</button><button type="button" class="big" id="stay">Chơi tiếp ▶</button></div>`);
  $('leave').onclick = () => { closeModal(); showMap(); }; $('stay').onclick = () => { closeModal(); paused = was; idleAt = performance.now(); };
};

/* ===== BẢN ĐỒ ===== */
function roomOpen(id) { if (id > FREE_ROOMS && !hasCard()) return false; return id === 1 || !!(SV.best[id - 1] && SV.best[id - 1].stars); }

  $('wallet').innerHTML = `<span class="chip gold">🪙 ${Bridge.coins().toLocaleString('vi')} xu khách sạn</span>${HS ? `<span class="chip">🏨 ${star}★</span>` : ''}<span class="chip">🧠 ${due} thẻ cần ôn</span><span class="chip">💣${SV.boost.bomb || 0} 🔨${SV.boost.hammer || 0} 🔀${SV.boost.mix || 0}</span>`;
  $('mapNote').innerHTML = HS ? 'Câu hỏi lấy từ Sổ ôn của game Khách sạn: thẻ đến hạn hỏi trước. Xu kiếm được cộng thẳng vào khách sạn của bạn.' : 'Xu kiếm được sẽ cộng vào game Khách sạn Vịnh Ā Bǎo khi bạn mở game. Từ trả lời sai vào Sổ ôn để nhắc ôn.';
}

    return `<div class="floor" id="fl${f.n}"><h3>Tầng ${f.n} · ${esc(f.name)} <small><span lang="zh-CN">${f.zh}</span> ${f.py} · ${f.hsk}</small></h3><div class="rooms">${ids.map(id => {
      const b = SV.best[id], open = roomOpen(id), st = b ? b.stars : 0;
      return `<button type="button" class="door${id === cur && open ? ' cur' : ''}${open ? '' : ' lock'}" data-room="${id}" aria-label="Phòng ${LEVELS[id - 1].name}">${open ? LEVELS[id - 1].name.replace('Phòng ', '') : '🔒'}<i class="${st ? '' : 'e'}">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</i></button>`; }).join('')}</div>
      ${locked ? `<p class="lockmsg">Tầng ${f.n} (${f.hsk}) dùng thẻ tự học · 3 tháng ${MEMBER_3M} · 1 năm ${MEMBER_PRICE}. <a href="${CARD_URL}" target="_top">🎫 Xem thẻ tự học</a></p>` : ''}</div>`; }).join('');
  $('tower').querySelectorAll('[data-room]').forEach(b => b.onclick = () => { const id = +b.dataset.room; Sfx.wake(); if (!roomOpen(id)) { Sfx.bad(); toast(id > FREE_ROOMS && !hasCard() ? 'Tầng 3–4 dùng thẻ tự học 🎫' : 'Dọn xong phòng trước để mở phòng này'); return; } Sfx.ui(); startLevel(id); });
  $('goBtn').textContent = SV.best[1] ? '▶ Chơi tiếp' : '▶ Chơi ngay';
  const vb = $('vipBtn'), used = SV.vipDay === dayKey(); vb.classList.toggle('used', used);
  vb.innerHTML = `👑<span>Phòng VIP hôm nay<small>Cả nhà chơi cùng một bàn · thắng lần đầu trong ngày: xu ×2</small></span><i>${used ? 'Đã nhận ×2 ✓' : 'Vào ▶'}</i>`;
  const fl = $('fl' + Math.ceil(cur / 5)); if (fl) fl.scrollIntoView({ block: 'center' });

$('vipBtn').onclick = () => { Sfx.wake(); Sfx.ui(); startLevel(0, { vip: true }); };
$('goBtn').onclick = () => { Sfx.wake(); Sfx.ui(); const c = curRoom(); startLevel(roomOpen(c) ? c : Math.min(c, FREE_ROOMS)); };
$('homeBtn').onclick = e => { e.preventDefault(); Sfx.ui(); Bridge.close(); };
function syncMute() { $('muteM').textContent = $('muteP').textContent = SV.mute ? '🔇' : '🔊'; }
$('muteM').onclick = $('muteP').onclick = () => { SV.mute = !SV.mute; save(); syncMute(); Sfx.mute(SV.mute); if (!SV.mute) Sfx.ui(); };
syncMute();

addEventListener('resize', () => { if (state === 'play' || state === 'end') { resize(); } });
document.addEventListener('visibilitychange', () => { Sfx.pause(document.hidden); if (!document.hidden) { idleAt = performance.now(); } });
addEventListener('storage', e => { if (e.key === HOTEL_KEY || e.key === WORDS_KEY) { HS = hotel(); Words.load(); if (state === 'map') renderWallet(); } });

requestAnimationFrame(draw);

if (QS.get('vip')) startLevel(0, { vip: true }); else if (want && roomOpen(want)) startLevel(want); else if (QS.get('lv') === 'next') { const c = curRoom(); startLevel(roomOpen(c) ? c : 1); } else showMap();

if (FROM_ARC) $('homeBtn').innerHTML = '♨️ Khu trò chơi';

/* móc kiểm thử (tools/test/xiao.js) */
window.__xiao = {
  Sfx, get G() { return G; }, get state() { return state; }, get busy() { return busy; }, get paused() { return paused; }, get time() { return timeLeft; }, get phao() { return phao; },
  speed(k) { SPEED = k; }, setTime(s) { timeLeft = s; renderTime(); },
  async move() { const m = G.bestMove(); if (m) await trySwap(m.a, m.b); return !!m; },
  answer(ok) { const q = window.__xiaoQ; if (!q) return false; const k = ok ? q.answer : (q.answer + 1) % q.opts.length; const b = document.querySelector(`.opt[data-k="${k}"]`); if (b) b.click(); return !!b; },
  start(id, o) { startLevel(id, o); }, go() { const b = $('goPlay'); if (b) b.click(); },
  get tier() { return tier; }, get fever() { return { v: fever, on: feverOn, max: FMAX() }; }, feverNow() { startFever(); },
};
})();
