<script>
(() => {
'use strict';
/* ===== CẤU HÌNH ===== */
const GAME_URL = 'https://ngoquocgiabao-hy.github.io/Baokhua/khachsan.html';
const ZALO_LINK = 'https://zalo.me/g/16yx8ptwane8ggwrnyxl';
const GOOGLE_FORM_LINK = 'https://docs.google.com/forms/d/e/1FAIpQLScj8_vHO1PIhhjjy1wsuISmVK2IGsK4h0FK6N1RAnBUr1A_Sw/viewform';
const FORM_UTM = 'utm_source=game_khachsan&utm_campaign=lop_0211';
const SAVE_KEY = 'baokhua_hotel_v1';
const FAST_SECONDS = 5;
const STAR_PTS = [0, 50, 160, 400, 750];
const IDLE_EVERY_MS = 15000;
const OFFLINE_CAP_MIN = 60;
const GAME_DAY_MS = 12 * 60 * 1000;          // chế độ nhanh: 1 ngày game = 12 phút thật

/* ===== NGÂN HÀNG CÂU HỎI (dùng chung với game Đánh Boss) ===== */
/** Schema bắt buộc (9 field) → runtime. Field phụ: type/topic/zh/optionPy/optionVi/words/... */
function normalizeQ(raw) {
  if (!raw) return raw;
  if (raw.cau_hoi == null && (raw.q != null || raw.options != null)) return raw;
  const type = raw.type || 'mc';
  const topic = raw.topic || (String(raw.chang||'').includes('Cẩm') ? 'factory' : 'hotel');
  const answer = (type === 'order' && raw.answerOrder) ? raw.answerOrder : (raw.dung != null ? raw.dung : 0);
  const q = {
    id: raw.id, chang: raw.chang, ngon_ngu: raw.ngon_ngu || 'zh', do_kho: raw.do_kho || 1,
    type, topic,
    q: raw.cau_hoi,
    options: raw.dap_an || [],
    answer,
    py: raw.pinyin || '',
    vi: raw.giai_thich || '',
    zh: raw.zh || '',
    optionPy: raw.optionPy, optionVi: raw.optionVi,
    words: raw.words, wordPy: raw.wordPy, wordVi: raw.wordVi,
    speak: raw.speak, blankHint: raw.blankHint, stage: raw.stage
  };
  if (!q.zh) {
    if (type === 'order' && q.options[0]) q.zh = q.options[0];
    else if (typeof answer === 'number' && q.options[answer]) q.zh = q.options[answer];
  }
  return q;
}
function normalizeQuestions(arr) { return (arr || []).map(normalizeQ); }

const QUESTIONS_RAW = [

const Snd = (() => {

    if (ctx) return ctx;

  function decode(ab) { return new Promise((res, rej) => { try { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); } catch (e) { rej(e); } }); }

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    hit: r => tone('square', 520 * r, 200 * r, .09, .14),

    win: r => [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f * r, f * r, .16, .18, i * .09)),
    hurt: r => tone('sawtooth', 240 * r, 80 * r, .2, .16)

  function ok() { if (S.muted || !ens()) return false; if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} } return true; }

      if (buf[n]) { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf[n]; s.playbackRate.value = rate; g.gain.value = VOL[n] || .4; s.connect(g); g.connect(master); s.start(); }

  function starUp() { if (!ok()) return; try { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone('triangle', f, f * 1.01, .22, .16, i * .1)); } catch (e) {} }
  function discover() { if (!ok()) return; try { [1047, 1319, 1568].forEach((f, i) => tone('sine', f, f, .12, .1, i * .06)); } catch (e) {} }
  function click() { if (!ok()) return; try { tone('square', 1800, 1200, .03, .05); } catch (e) {} }
  function boom() { if (!ok()) return; try { tone('sine', 120, 40, .5, .18); } catch (e) {} }
  function startBgm() { if (S.muted || !ctx || bgm || !buf.bgm) return; try { const g = ctx.createGain(); g.gain.value = VOL.bgm; bgm = ctx.createBufferSource(); bgm.buffer = buf.bgm; bgm.loop = true; bgm.connect(g); g.connect(master); bgm.start(); } catch (e) { bgm = null; } }

})();

/* ===== CHỌN CÂU HỎI (Sổ ôn: ưu tiên câu từng sai) ===== */
let recent = [];
function pickQuestion(topic) {
  let pool = QUESTIONS.filter(q => q.topic === topic);
  if (!pool.length) pool = QUESTIONS.filter(q => topics().includes(q.topic));
  const fresh = pool.filter(q => !recent.includes(q.id));
  if (fresh.length) pool = fresh;
  const weak = pool.filter(q => S.mem[q.id] != null && S.mem[q.id] <= 1);
  const unseen = pool.filter(q => S.mem[q.id] == null);
  let q;
  if (weak.length && Math.random() < .4) q = pick(weak);
  else if (unseen.length && Math.random() < .7) q = pick(unseen);
  else {
    const w = pool.map(x => 5 - Math.min(4, S.mem[x.id] || 0));
    let r = Math.random() * w.reduce((a, b) => a + b, 0); q = pool[0];
    for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) { q = pool[i]; break; } }
  }
  recent.push(q.id); if (recent.length > 6) recent.shift();
  return q;
}
function itemQuestion(it) {
  const others = shuffle(ITEMS.filter(x => x.id !== it.id)).slice(0, 3);
  const all = shuffle([it].concat(others));
  const ans = all.indexOf(it);
  if (Math.random() < .5) return { id: 'it-' + it.id, type: 'mc', topic: 'buy', q: `“${it.vi}” tiếng Trung là gì?`, options: all.map(x => x.zh), answer: ans, optionPy: all.map(x => x.py), optionVi: all.map(x => x.vi), zh: it.zh, py: it.py, vi: it.vi };
  return { id: 'it-' + it.id, type: 'mc', topic: 'buy', q: `${it.zh} nghĩa là gì?`, options: all.map(x => x.vi), answer: ans, zh: it.zh, py: it.py, vi: it.vi };
}

/* ===== BẢNG HỎI–ĐÁP ===== */
let Q = null, combo = 0, orderPicked = [];
function correctText(q) { if (q.type === 'order') return (q.answer || []).join(''); return typeof q.answer === 'number' ? (q.options[q.answer] || '') : ''; }
function fullZh(q) { const a = correctText(q); let z = q.zh || ''; if (!z && hasHan(a)) z = a; return z.includes('____') ? z.replace('____', a) : z; }
function fullPy(q) { let p = q.py || ''; if (p.includes('____') && q.optionPy && typeof q.answer === 'number') p = p.replace('____', q.optionPy[q.answer] || '…'); return p; }
function openSheet() { $('sheet').classList.add('on'); Scene.sheet = true; }
function closeSheet() { $('sheet').classList.remove('on'); Scene.sheet = false; Q = null; if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {} }

function openServe() {
  if (Q) return;
  const g = Scene.queue[0];
  if (!g) { toast('Khách đang tới…'); return; }
  Snd.unlock();
  const q = pickQuestion(g.topic);
  Q = { kind: 'serve', q, g, t0: Date.now(), locked: false };
  $('shAv').textContent = g.av;
  $('shName').textContent = g.name;
  $('shSub').textContent = `${TOPIC_LABEL[g.topic]} · trả phòng ${fare()} 🪙`;
  $('tipWrap').hidden = false;
  renderQuestion(q); openSheet(); startTipBar();
}
function openBuy(it) {
  if (Q) return;
  Snd.unlock();
  const q = itemQuestion(it);
  Q = { kind: 'buy', q, it, t0: Date.now(), locked: false };
  $('shAv').textContent = it.ico;
  $('shName').textContent = `Mua: ${it.vi} – ${priceOf(it)} 🪙`;
  $('shSub').textContent = 'Trả lời đúng tên món để chốt đơn';
  $('tipWrap').hidden = true;
  renderQuestion(q); openSheet();
}
function startTipBar() { const i = $('tipBar'); i.style.transition = 'none'; i.style.transform = 'scaleX(1)'; void i.offsetWidth; i.style.transition = `transform ${FAST_SECONDS}s linear`; i.style.transform = 'scaleX(0)'; }
function renderQuestion(q) {
  orderPicked = [];
  $('shCombo').textContent = combo >= 2 ? `🔥 x${(1 + .1 * Math.min(10, combo)).toFixed(1)}` : '';
  $('qTags').innerHTML = q.topic === 'buy' ? '<span class="tag buy">Mua đồ</span>' : `<span class="tag ${q.type}">${TYPE_LABEL[q.type] || q.type}</span>`;
  $('qText').textContent = q.q || '';
  let zh = '', py = '', vi = '';
  if (q.type === 'situ') vi = 'Chọn câu phù hợp — mỗi đáp án có pinyin + nghĩa Việt.';
  else if (q.type === 'order') { py = q.py ? 'Gợi ý pinyin: ' + q.py : ''; vi = q.vi ? 'Nghĩa: ' + q.vi : ''; }
  else if (q.type === 'listen') vi = 'Bấm 🔊 Nghe, rồi chọn đáp án đúng.';
  else if (q.type === 'mc' && hasHan(correctText(q))) { /* hỏi Việt → Trung: không lộ chữ Hán */ }
  else if (q.type === 'mc') { zh = q.zh || ''; py = q.py || ''; }
  else if (q.type === 'fill') { zh = q.zh && q.zh !== '____' ? q.zh : ''; py = (q.py && q.py.includes('____')) ? q.py : ''; vi = q.vi || ''; }
  else { zh = q.zh || ''; py = q.py || ''; vi = q.vi || ''; }
  $('qZh').textContent = zh; $('qPy').textContent = py; $('qVi').textContent = vi;
  $('qExtra').innerHTML = ''; $('explainSlot').innerHTML = '';
  const o = $('opts'); o.innerHTML = ''; o.classList.remove('revealed');
  if (q.type === 'listen') {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost'; b.style.marginTop = '8px'; b.textContent = '🔊 Nghe';
    b.onclick = () => { if (!speak(q.speak || q.zh, true)) { $('qZh').textContent = q.zh; $('qPy').textContent = q.py; } };
    $('qExtra').appendChild(b);
    if (!speak(q.speak || q.zh, true)) { $('qZh').textContent = q.zh; $('qPy').textContent = q.py; $('qVi').textContent = 'Máy không có giọng đọc tiếng Trung — đọc theo chữ.'; }
  }
  if (q.type === 'order') renderOrder(q, o); else renderOptions(q, o);
}
function renderOptions(q, o) {
  shuffle([...Array(q.options.length).keys()]).forEach(k => {
    const t = q.options[k], b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.dataset.orig = k;
    let h = `<span>${esc(t)}</span>`;
    if (hasHan(t)) { if (q.optionPy && q.optionPy[k]) h += `<span class="py">${esc(q.optionPy[k])}</span>`; if (q.optionVi && q.optionVi[k]) h += `<span class="vi-ans">${esc(q.optionVi[k])}</span>`; }
    b.innerHTML = h; b.onclick = () => choose(k, b); o.appendChild(b);
  });
}
function renderOrder(q, o) {
  const slot = document.createElement('div'); slot.className = 'order-slot'; slot.id = 'orderSlot';
  const hint = document.createElement('p'); hint.className = 'order-hint'; hint.textContent = 'Chạm từ theo đúng thứ tự · chạm từ ở ô trên để bỏ · đủ từ là tự kiểm tra';
  const chips = document.createElement('div'); chips.className = 'chips'; chips.id = 'orderChips';
  const total = q.words.length;
  shuffle(q.words).forEach(w => {
    const idx = q.words.indexOf(w), py = q.wordPy ? q.wordPy[idx] : '', vi = q.wordVi ? q.wordVi[idx] : '';
    const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.dataset.w = w;
    c.innerHTML = esc(w) + (py || vi ? `<span class="py">${esc([py, vi].filter(Boolean).join(' · '))}</span>` : '');
    c.onclick = () => {
      if (c.classList.contains('used') || !Q || Q.locked) return;
      c.classList.add('used'); orderPicked.push(w); Snd.play('ui', 1 + orderPicked.length * .1);
      const p = document.createElement('button'); p.type = 'button'; p.className = 'chip'; p.textContent = w;
      p.onclick = () => { if (!Q || Q.locked) return; const i = [...slot.children].indexOf(p); if (i >= 0) orderPicked.splice(i, 1); p.remove(); c.classList.remove('used'); };
      slot.appendChild(p);
      if (orderPicked.length === total) setTimeout(() => {
        if (!Q || Q.locked || orderPicked.length !== total) return;
        const ok = orderPicked.every((x, i) => x === q.answer[i]);
        slot.style.borderStyle = 'solid'; slot.style.borderColor = ok ? '#3dd17a' : '#ff5a5a';
        resolve(ok, slot);
      }, 200);
    };
    chips.appendChild(c);
  });
  const reset = document.createElement('button'); reset.type = 'button'; reset.className = 'btn ghost'; reset.style.marginTop = '8px'; reset.textContent = '↺ Xóa hết';
  reset.onclick = () => { if (!Q || Q.locked) return; orderPicked = []; slot.innerHTML = ''; chips.querySelectorAll('.chip').forEach(c => c.classList.remove('used')); };
  o.append(slot, hint, chips, reset);
}
function choose(k, btn) {
  if (!Q || Q.locked) return;
  const q = Q.q, ok = k === q.answer;
  const btns = [...$('opts').querySelectorAll('.opt')];
  const good = btns.find(b => +b.dataset.orig === q.answer); if (good) good.classList.add('ok');
  if (!ok) btn.classList.add('no');
  $('opts').classList.add('revealed');
  resolve(ok, ok ? btn : good);
}
function remember(id, ok) { S.mem[id] = ok ? Math.min(4, (S.mem[id] || 0) + 1) : 0; }
function resolve(ok, el) {
  if (!Q || Q.locked) return;
  Q.locked = true;
  const q = Q.q, secs = (Date.now() - Q.t0) / 1000;
  $('qZh').textContent = fullZh(q); $('qPy').textContent = fullPy(q); $('qVi').textContent = q.vi || '';
  const ti = $('tipBar'); const m = getComputedStyle(ti).transform; ti.style.transition = 'none'; ti.style.transform = m === 'none' ? 'scaleX(0)' : m;
  remember(q.id, ok);
  const r = rectOf(el) || rectOf($('opts'));
  const cx = r ? r.left + r.width / 2 : innerWidth / 2, cy = r ? r.top + r.height / 2 : innerHeight / 2;
  if (Q.kind === 'serve') {
    const g = Q.g; S.served++;
    if (ok) {
      combo++; S.correct++; S.bestCombo = Math.max(S.bestCombo, combo);
      const fast = secs <= FAST_SECONDS, vip = S.vipDay !== localDay(0);
      const earn = Math.round(fare() * (1 + .1 * Math.min(10, combo - 1)) * (fast ? 1.5 : 1) * (vip ? 3 : 1));
      if (vip) S.vipDay = localDay(0);
      markToday();
      vib(25); Snd.coin(combo); Snd.play('hit', Math.min(1.5, 1 + combo * .05));
      burstAt(cx, cy, combo >= 5 ? 24 : 14, combo >= 5 ? 130 : 90);
      floatText(cx, cy - 10, `+${earn}${fast ? ' ⚡' : ''}${vip ? ' 👑VIP' : ''}`);
      if (q.type !== 'listen') speak(fullZh(q));
      S.coins += earn; save();
      coinFly(cx, cy, earn, () => { renderHud(); renderBuild(); });
      setTimeout(() => { closeSheet(); Scene.served(g, true); }, 900);
      if (combo === 5 || combo === 10) setTimeout(() => toast(`🔥 Combo ${combo}! Xu nhân x${(1 + .1 * Math.min(10, combo - 1)).toFixed(1)}`), 950);
    } else {
      combo = 0; markToday();
      S.coins += 2; save();
      Snd.play('hurt'); vib(120);
      floatText(cx, cy - 10, '+2', '#ffb4a8');
      explain(q, () => { closeSheet(); Scene.served(g, false); renderHud(); renderBuild(); });
    }
  } else {
    const it = Q.it;
    if (ok) {
      const price = priceOf(it);
      if (S.coins < price) { closeSheet(); toast('Không đủ xu'); return; }
      S.coins -= price; S.own[it.id] = owned(it.id) + 1; S.pts += it.pts;
      const before = S.star || 1, after = star(); S.star = after;
      save();
      Snd.coin(3); vib([20, 30, 20]); burstAt(cx, cy, 16, 90); speak(it.zh);
      setTimeout(() => {
        closeSheet();
        Scene.rebuild(it.id); Snd.build();
        toast(`Đã xây ${it.zh} (${it.py}) – ${it.vi}`);
        renderHud(); renderBuild(); Scene.refill();
        if (after > before) setTimeout(() => starUp(after), 1200);
      }, 650);
    } else {
      Snd.play('hurt'); save();
      explain(q, () => { closeSheet(); toast('Chưa trừ xu – ôn từ này rồi mua lại nhé'); renderReview(); });
    }
  }
  renderReview();
}
function explain(q, onNext) {
  const ans = correctText(q), zh = fullZh(q), py = fullPy(q);
  $('explainSlot').innerHTML = `<div class="explain"><div class="lab">✗ Đáp án đúng</div>
    ${ans && !hasHan(ans) ? `<div style="font-weight:800;margin-top:4px">${esc(ans)}</div>` : ''}
    ${zh ? `<div class="qzh">${esc(zh)}</div>` : ''}${py ? `<div class="qpy">${esc(py)}</div>` : ''}${q.vi ? `<div class="qvi">${esc(q.vi)}</div>` : ''}
    <div class="row-btns">${zh ? '<button type="button" class="btn ghost" id="exSpeak">🔊 Nghe</button>' : ''}<button type="button" class="btn" id="exNext">Tiếp ▶</button></div></div>`;
  if ($('exSpeak')) $('exSpeak').onclick = () => speak(zh, true);
  let done = false;
  $('exNext').onclick = () => { if (done) return; done = true; Snd.play('ui'); onNext(); };
  try { $('explainSlot').scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); } catch (e) {}
  if (zh) speak(zh);
}

/* ===== LÊN SAO ===== */
function starUp(s) {
  Snd.starUp(); vib([30, 40, 30, 40, 80]);
  const un = ITEMS.filter(i => i.star === s);
  showOv('⭐'.repeat(Math.min(s, 5)), `Khách sạn đạt ${s} sao!`,
    `<p>Lễ tân Bảo được đồng phục mới, mặt tiền đổi màu, giá phòng tăng. Mở khoá:</p>
     <div class="unlock-list">${un.map(i => `<span>${i.ico} ${esc(i.zh)} · ${esc(i.vi)}</span>`).join('') || '<span>Toàn bộ công trình!</span>'}</div>
     ${s >= 3 ? `<p>Bạn đã phục vụ được khách thật rồi đấy. Muốn nói trôi chảy ở quầy lễ tân thật?</p><a class="btn zalo" href="${ZALO_LINK}" target="_blank" rel="noopener">💬 Vào nhóm Zalo học cùng Bảo</a>` : ''}`, 'Tiếp tục xây');
  const r = rectOf($('ovBig')); if (r) setTimeout(() => burstAt(r.left + r.width / 2, r.top + r.height / 2, 30, 150), 300);
}
function showOv(big, title, body, btn, onClose) {
  $('ovBig').textContent = big; $('ovTitle').textContent = title; $('ovBody').innerHTML = body; $('ovBtn').textContent = btn || 'Tiếp tục';
  $('ov').classList.add('on');
  $('ovBtn').onclick = () => { $('ov').classList.remove('on'); Snd.unlock(); Snd.play('ui'); onClose && onClose(); };
}

/* ===== TAB ===== */
function renderBuild() {
  const st = star();
  const rows = ITEMS.map(it => {
    const n = owned(it.id), mx = maxOf(it), maxed = n >= mx, lock = st < it.star, need = needOf(it), price = priceOf(it);
    const can = !maxed && !lock && !need && S.coins >= price;
    let btn;
    if (maxed) btn = `<button class="buy" disabled>✓ Đã xây</button>`;
    else if (lock) btn = `<button class="buy" disabled>🔒 ${it.star}★</button>`;
    else if (need) btn = `<button class="buy" disabled>${esc(need)}</button>`;
    else btn = `<button class="buy" data-buy="${it.id}" ${S.coins >= price ? '' : 'disabled'}>${price} 🪙</button>`;
    return { it, html: `<div class="item ${lock ? 'lock' : ''} ${maxed ? 'maxed' : ''} ${can ? 'can' : ''}"><div class="ic">${it.ico}</div>
      <div class="t"><div class="zh">${esc(it.zh)} ${mx > 1 ? `<small style="font-size:12px;opacity:.75">${n}/${mx}</small>` : ''}</div><div class="py">${esc(it.py)}</div><div class="vi">${esc(it.vi)}</div><div class="eff">${esc(it.eff)}</div></div>${btn}</div>`, order: maxed ? 2 : lock ? 1 : 0 };
  });
  rows.sort((a, b) => a.order - b.order || a.it.star - b.it.star || priceOf(a.it) - priceOf(b.it));
  $('tab-build').innerHTML = `<div class="section-lab">Mua đồ = trả lời đúng tên tiếng Trung của món đó</div>` + rows.map(r => r.html).join('');
  $('tab-build').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const it = ITEM[b.dataset.buy]; if (S.coins < priceOf(it)) return toast('Chưa đủ xu – phục vụ thêm khách nhé'); openBuy(it); });
}
function reviewEntries() {
  const list = [];
  Object.keys(S.mem).forEach(id => {
    if (S.mem[id] > 0) return;
    if (id.startsWith('it-')) { const it = ITEM[id.slice(3)]; if (it) list.push({ zh: it.zh, py: it.py, vi: it.vi }); }
    else { const q = QUESTIONS.find(x => x.id === id); if (q) list.push({ zh: fullZh(q), py: fullPy(q), vi: q.vi, ans: hasHan(correctText(q)) ? '' : correctText(q) }); }
  });
  return list;
}
function renderReview() {
  const L = reviewEntries();
  const learned = QUESTIONS.filter(q => (S.mem[q.id] || 0) >= 1).length, mastered = QUESTIONS.filter(q => (S.mem[q.id] || 0) >= 2).length;
  const keys = Object.keys(WORDS), found = keys.filter(k => S.found[k]).length;
  $('tab-review').innerHTML = `<div class="card"><b>📚 Đã học ${learned}/${QUESTIONS.length} câu</b> · thuộc chắc ${mastered}
      <div class="mini" style="margin-top:6px;height:8px"><i style="width:${Math.round(learned / QUESTIONS.length * 100)}%"></i></div>
      <p class="note" style="margin-top:6px">Câu sai được khách hỏi lại sớm hơn. Trả lời đúng 2 lần là thuộc chắc.</p></div>
    <div class="card">${L.length ? L.slice(0, 30).map((e, i) => `<div class="rv-item"><div class="t">${e.ans ? `<div class="vi" style="font-weight:700">${esc(e.ans)}</div>` : ''}<div class="zh">${esc(e.zh)}</div><div class="py">${esc(e.py)}</div><div class="vi">${esc(e.vi)}</div></div><button type="button" data-say="${i}" aria-label="Nghe">🔊</button></div>`).join('') : '<p class="note">Chưa có câu sai nào. Giỏi lắm! 🎉</p>'}</div>
    <div class="card"><b>🔎 Từ khám phá trên phố: ${found}/${keys.length}</b><p class="note" style="margin:4px 0 8px">Chạm vào xe, người, quán, phòng khách… để nghe và học từ. Từ mới +2 🪙.</p>
      <div class="found-grid">${keys.map(k => S.found[k] ? `<span data-w="${k}">${esc(WORDS[k][0])} · ${esc(WORDS[k][2])}</span>` : '<span class="no">？</span>').join('')}</div></div>`;
  $('tab-review').querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(L[+b.dataset.say].zh, true));
  $('tab-review').querySelectorAll('[data-w]').forEach(b => b.onclick = () => speak(WORDS[b.dataset.w][0], true));
}
function renderMe() {
  const acc = S.served ? Math.round(S.correct / S.served * 100) : 0;
  const built = ITEMS.reduce((n, i) => n + owned(i.id), 0), total = ITEMS.reduce((n, i) => n + maxOf(i), 0);
  $('tab-me').innerHTML = `<div class="stats"><div><b>${S.served}</b>khách đã phục vụ</div><div><b>${acc}%</b>trả lời đúng</div><div><b>${S.bestCombo}</b>combo cao nhất</div>
      <div><b>${built}/${total}</b>công trình</div><div><b>${streakAlive()}</b>ngày liên tiếp</div><div><b>${S.checkouts || 0}</b>lượt trả phòng</div></div>
    <div class="card" style="background:linear-gradient(160deg,#FFF7D6,#FFD91F);color:#16171B">
      <b style="font-size:17px">🎓 Học thật với Bảo Khựa 阿宝</b>
      <p style="font-size:13px;margin:6px 0 10px">Lớp Zoom tiếng Trung thực chiến 20:00 thứ Hai, Tư, Sáu · Thẻ hội viên 99k/3 tháng, 299k/năm.</p>
      <div style="display:flex;flex-direction:column;gap:8px"><a class="btn dark" href="${withUtm(GOOGLE_FORM_LINK, FORM_UTM)}" target="_blank" rel="noopener">📝 Đăng ký thẻ</a>
      <a class="btn zalo" href="${ZALO_LINK}" target="_blank" rel="noopener">💬 Vào nhóm Zalo</a></div></div>
    <div class="card"><label class="toggle"><span>🔋 Chế độ mượt cho máy yếu (30 khung hình/giây, ít người xe hơn)</span><input type="checkbox" id="lowChk" ${Scene.low ? 'checked' : ''}></label></div>
    <div class="row-btns"><button type="button" class="btn ghost" id="shareBtn">📤 Khoe khách sạn</button><a class="btn ghost" href="game.html">⚔️ Chế độ Đánh Boss</a></div>`;
  $('shareBtn').onclick = share;
  $('lowChk').onchange = e => Scene.setLow(e.target.checked);
}
async function share() {
  const text = `Khách sạn Bảo Khựa của mình đạt ${star()}★, phục vụ ${S.served} khách bằng tiếng Trung! 🏨\nXây khách sạn của bạn: ${GAME_URL}`;
  try { if (navigator.share) { await navigator.share({ title: 'Khách sạn Bảo Khựa 阿宝', text, url: GAME_URL }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Đã copy – dán vào Zalo/Facebook nhé'); } catch (e) { toast(GAME_URL); }
}
function switchTab(t) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'tab-' + t));
  if (t === 'review') renderReview(); if (t === 'me') renderMe(); if (t === 'build') renderBuild();
  Snd.play('ui');
}

/* ===== THU NHẬP NHÂN VIÊN ===== */
function idleTick() {
  const n = owned('staff'); if (!n || document.hidden) return;
  S.coins += n; save(); renderHud(); renderBuild();
}
function awayEarnings(since) {
  if (!since || !owned('staff')) return 0;
  const mins = Math.min(OFFLINE_CAP_MIN, Math.max(0, (Date.now() - since) / 60000));
  return mins < 1 ? 0 : Math.floor(mins * (60000 / IDLE_EVERY_MS) * owned('staff') * .5);
}
let hiddenAt = 0;

/* ===== KHỞI ĐỘNG ===== */
function init() {
  const away = awayEarnings(S.lastSeen);
  S.star = star();
  Scene.init();
  renderHud(); renderBuild();
  $('serveBtn').onclick = openServe;
  $('shClose').onclick = () => { if (Q && Q.locked && Q.kind === 'serve') return; closeSheet(); };
  $('muteBtn').onclick = () => { S.muted = !S.muted; save(); Snd.unlock(); Snd.setMuted(S.muted); renderHud(); if (!S.muted) Snd.play('ui'); };
  $('zoomBtn').onclick = () => { const z = Scene.zoom > 1 ? 1 : 1.75; Scene.setZoom(z); $('zoomBtn').classList.toggle('on', z > 1); $('zoomBtn').textContent = z > 1 ? '↙' : '🔍'; Snd.play('ui'); if (z > 1) toast('Kéo theo mọi hướng để xem từng phòng'); };
  setTimeout(() => { const t = $('sceneTip'); if (t) t.style.opacity = '0'; }, 8000);
  $('clockBtn').onclick = () => {
    if (S.clock === 'real') { S.clock = 'fast'; setHour(nowHour()); toast('⏩ Thời gian nhanh: 1 ngày = 12 phút'); }
    else { S.clock = 'real'; toast('🕐 Thời gian thật theo đồng hồ của bạn'); }
    save(); Snd.play('ui');
  };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.body.addEventListener('pointerdown', () => Snd.unlock(), { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); Snd.suspend(); Scene.setActive(false); return; }
    Snd.resume(); Scene.setActive(true);
    const got = awayEarnings(hiddenAt); hiddenAt = 0;
    if (got > 0) { S.coins += got; save(); renderHud(); renderBuild(); toast(`🧑‍💼 Nhân viên thu được +${got} 🪙 khi bạn vắng`); }
  });
  setInterval(idleTick, IDLE_EVERY_MS);
  if (window.speechSynthesis) speechSynthesis.getVoices();
  if (!S.intro) {
    showOv('🏨', 'Khách sạn Bảo Khựa', `<p>Bạn là lễ tân ở Bãi Cháy. Khách Trung Quốc xếp hàng chờ ở cửa:</p>
      <p>🛎️ <b>Trả lời đúng tiếng Trung</b> → khách vui, trả xu, lên phòng bật đèn.</p>
      <p>🏗️ <b>Dùng xu xây khách sạn</b>: tầng lầu, gym, bể bơi, nhà hàng… mua món nào phải nói đúng tên tiếng Trung món đó.</p>
      <p>🔎 <b>Chạm vào mọi thứ trên phố</b> (xe máy, quán, khách đang ngủ…) để học từ mới.</p>
      <p>🌙 Phố chuyển ngày đêm: 1 ngày = 12 phút. Khuya khách đi ngủ, quán đóng cửa, đèn tắt dần.</p>`, 'Mở cửa đón khách', () => { S.intro = true; save(); });
  } else if (away > 0) {
    S.coins += away; save();
    showOv('🧑‍💼', 'Chào mừng trở lại!', `<p>Khi bạn vắng, nhân viên đã thu <b>+${away} 🪙</b>.</p><p>Khách mới đang chờ ở quầy.</p>`, 'Nhận xu', () => renderHud());
  }
  save();
}
init();

/* hook kiểm thử (không ảnh hưởng chơi) */
window.__hotel = {
  get S() { return S; }, get Q() { return Q; }, get queue() { return Scene.queue; }, ITEMS, QUESTIONS, star, fare, Scene, setHour, gameHour,
  openServe, openBuy: id => openBuy(ITEM[id]),
  answer(correct) {
    if (!Q || Q.locked) return false;
    const q = Q.q;
    if (q.type === 'order') { const seq = correct ? q.answer : q.answer.slice().reverse(); seq.forEach(w => { const c = document.querySelector(`#orderChips .chip[data-w="${w}"]:not(.used)`); c && c.click(); }); return true; }
    const btn = [...document.querySelectorAll('#opts .opt')].find(b => correct ? +b.dataset.orig === q.answer : +b.dataset.orig !== q.answer);
    btn && btn.click(); return true;
  }
};
})();
</script>
